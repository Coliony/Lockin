        const e2 = { id: uid(), name: food.name, qty: st.qty, unit, base: food.base, n: { ...food.n }, moment: st.moment, foodId, meal: food.src === 'meal' };
        (S.diet.log[ctx.date] = S.diet.log[ctx.date] || []).push(e2);
        save(); closeSheet(ctx.fromSearch ? 2 : 1); refresh();
        toast(`Ajouté · ${fmtNum(r0(entryTot(e2).kcal))} kcal`, 'Annuler', () => { const l = S.diet.log[ctx.date] || []; const j = l.indexOf(e2); if (j >= 0) l.splice(j, 1); if (!l.length) delete S.diet.log[ctx.date]; save(); refresh(); });
      }
    });
  });
}
/* ---------- Ma diète : ce que je prévois de manger chaque jour, à cocher ---------- */
const planItems = () => (S.diet.plan && S.diet.plan.items) || [];
// Valeurs d'une ligne : pour un repas, on prend la portion actuelle du repas (s'il existe encore)
function planNut(it) {
  if (it.mealId) { const m = S.diet.meals.find(x => x.id === it.mealId); if (m) return mealPer(m); }
  return it.n;
}
const planTot = it => { const n = planNut(it); return { kcal: n.kcal * it.qty / it.base, p: n.p * it.qty / it.base, c: n.c * it.qty / it.base, f: n.f * it.qty / it.base }; };
const planEntry = (k, it) => (S.diet.log[k] || []).find(e => e.planId === it.id);
function addPlanEntry(k, it) {
  const e = { id: uid(), name: it.name, qty: it.qty, unit: it.unit, base: it.base, n: { ...planNut(it) }, moment: it.moment, foodId: null, meal: !!it.mealId, planId: it.id };
  (S.diet.log[k] = S.diet.log[k] || []).push(e);
  return e;
}
function removeEntry(k, e) {
  const l = S.diet.log[k] || [], i = l.indexOf(e);
  if (i >= 0) l.splice(i, 1);
  if (!l.length) delete S.diet.log[k];
}
function tickPlan(k, it) {
  const e = planEntry(k, it);
  if (e) { removeEntry(k, e); save(); refresh(); return; }
  addPlanEntry(k, it); save(); refresh();
  const items = planItems(), done = items.filter(x => planEntry(k, x)).length;
  if (done === items.length) toast('Diète du jour suivie à 100 % 💪');
}
function tickAllPlan(k) {
  const added = planItems().filter(it => !planEntry(k, it)).map(it => addPlanEntry(k, it));
  if (!added.length) return;
  save(); refresh();
  toast(`${added.length} ligne${added.length > 1 ? 's' : ''} cochée${added.length > 1 ? 's' : ''}`, 'Annuler', () => { added.forEach(e => removeEntry(k, e)); save(); refresh(); });
}
function planCard(k) {
  const items = planItems();
  let html = `<div class="section sec-row"><span>Ma diète</span><button data-act="planEdit">${items.length ? 'Modifier' : 'Définir'}</button></div>`;
  if (!items.length) return html + `<button class="ncard plan-empty" data-act="planEdit"><b>📋 Définis ta diète</b>
    <span class="mute small">Ajoute les aliments et repas que tu dois manger chaque jour, puis coche-les ici au fil de la journée.</span></button>`;
  const done = items.filter(it => planEntry(k, it)).length;
  const kcalPlan = items.reduce((s, it) => s + planTot(it).kcal, 0);
  html += `<div class="ncard plan"><div class="phead"><div><b>${done}/${items.length}</b> cochés <span class="mute small">· ${fmtNum(r0(kcalPlan))} kcal prévues</span></div>
      ${done < items.length ? '<button class="gadd" data-act="planAll">Tout cocher</button>' : '<span class="pdone">✓ Suivie</span>'}</div>
    <div class="nbar" style="margin-top:10px"><i style="width:${(done / items.length * 100).toFixed(0)}%"></i></div>`;
  MOMENTS.forEach(([id, label, ic]) => {
    const list = items.filter(it => it.moment === id);
    if (!list.length) return;
    html += `<div class="pmom">${ic} ${label}</div>` + list.map(it => {
      const on = !!planEntry(k, it), t = planTot(it);
      return `<button class="pline ${on ? 'on' : ''}" data-act="planTick" data-id="${it.id}"><span class="pchk">${I.check}</span>
        <div class="pl-body"><div class="fname">${it.mealId ? '🍲 ' : ''}${esc(it.name)}</div><small>${esc(qtyLabel(it.qty, it.unit))} · P ${fmtG(t.p)} · G ${fmtG(t.c)} · L ${fmtG(t.f)}</small></div>
        <b>${fmtNum(r0(t.kcal))}</b></button>`;
    }).join('');
  });
  // Suivi de la diète sur les 7 derniers jours (jusqu'au jour affiché)
  const start = S.diet.plan.created || k;
  let sum = 0, n = 0, dots = '';
  for (let i = 6; i >= 0; i--) {
    const d = addDays(k, -i);
    if (d < start || d > todayKey()) { dots += `<div class="pday"><i class="none"></i><span>${LETTER[parse(d).getDay()]}</span></div>`; continue; }
    const c = items.filter(it => planEntry(d, it)).length, p = c / items.length;
    sum += p; n++;
    dots += `<div class="pday"><i class="${p >= 1 ? 'full' : p >= .5 ? 'half' : p > 0 ? 'low' : 'zero'}" title="${Math.round(p * 100)} %"></i><span>${LETTER[parse(d).getDay()]}</span></div>`;
  }
  html += `<div class="pweek"><div class="pdots">${dots}</div><div class="mute small">${n ? `Suivie à <b style="color:var(--text)">${Math.round(sum / n * 100)} %</b> sur ${n} jour${n > 1 ? 's' : ''}` : ''}</div></div></div>`;
  return html;
}
// Éditeur de la diète
function openPlan() {
  const st = { items: planItems().map(it => ({ ...it, n: { ...it.n } })) };
  openSheet('', (el, w) => {
    const totals = () => {
      const t = { kcal: 0, p: 0, c: 0, f: 0 };
      st.items.forEach(it => { const x = planTot(it); t.kcal += x.kcal; t.p += x.p; t.c += x.c; t.f += x.f; });
      const g = S.diet.goals;
      return `<div class="mtot"><span>Total prévu par jour (objectif ${fmtNum(g.kcal)} kcal)</span>
        <div class="macros" style="grid-template-columns:repeat(4,1fr);margin-top:8px">${[['kcal', 'Calories', 'var(--accent)', ''], ...MACROS.map(([k2, l, c]) => [k2, l, c, ' g'])].map(([key, l, col, u]) => {
          const goal = g[key], p = goal ? Math.min(1, t[key] / goal) : 0;
          return `<div class="mac" style="--mc:${col}"><span>${l}</span><b>${key === 'kcal' ? fmtNum(r0(t.kcal)) : fmtG(t[key])}<small> / ${fmtNum(goal)}${u}</small></b><div class="mbar"><i style="width:${(p * 100).toFixed(0)}%"></i></div></div>`;
        }).join('')}</div></div>`;
    };
    const draw = () => {
      let rows = '';
      MOMENTS.forEach(([id, label, ic]) => {
        const list = st.items.map((it, i) => [it, i]).filter(([it]) => it.moment === id);
        if (!list.length) return;
        rows += `<div class="pmom">${ic} ${label}</div>` + list.map(([it, i]) => { const t = planTot(it);
          return `<div class="irow"><div class="iname"><div class="fname">${it.mealId ? '🍲 ' : ''}${esc(it.name)}</div><small id="pk${i}">${fmtNum(r0(t.kcal))} kcal · P ${fmtG(t.p)} · G ${fmtG(t.c)} · L ${fmtG(t.f)}</small>
              <select class="msel" data-i="${i}">${MOMENTS.map(([mid, ml]) => `<option value="${mid}" ${mid === it.moment ? 'selected' : ''}>${ml}</option>`).join('')}</select></div>
            <input class="inp iq" data-i="${i}" inputmode="decimal" autocomplete="off" value="${String(it.qty).replace('.', ',')}"><span class="iu">${esc(it.unit === 'portion' ? 'port.' : it.unit)}</span>
            <button class="act del" data-pe="rm" data-i="${i}" aria-label="Retirer">${I.close}</button></div>`; }).join('');
      });
      el.innerHTML = `<div class="shead"><button class="iconbtn" data-pe="close" aria-label="Fermer">${I.close}</button><h2 style="margin:0">Ma diète</h2><span style="width:42px"></span></div>
        <div class="mute small" style="margin:-6px 0 14px;line-height:1.45">Les aliments et repas que tu prévois de manger chaque jour. Dans l’onglet Alimentation, tu les coches au fil de la journée : chaque ligne cochée s’ajoute à ton journal.</div>
        <div class="ilist">${rows || '<div class="fempty">Ta diète est vide. Ajoute tes aliments et tes repas (meal prep compris) avec leurs quantités et leur moment.</div>'}</div>
        <button class="qnone" data-pe="add" style="margin-top:10px">+ Ajouter un aliment ou un repas</button>
        <div id="ptots">${totals()}</div>
        <div class="mute small" style="margin-top:10px">Modifier ta diète ne change pas les jours déjà cochés.</div>
        <button class="btn" data-pe="save">Enregistrer ma diète</button>`;
      el.querySelectorAll('.iq').forEach(inp => inp.addEventListener('input', () => {
        const i = +inp.dataset.i, v = parseFloat(inp.value.replace(',', '.'));
        if (!(v >= 0)) return;
        st.items[i].qty = v;
        const t = planTot(st.items[i]);
        $('#pk' + i, el).textContent = `${fmtNum(r0(t.kcal))} kcal · P ${fmtG(t.p)} · G ${fmtG(t.c)} · L ${fmtG(t.f)}`;
        $('#ptots', el).innerHTML = totals();
      }));
      el.querySelectorAll('.msel').forEach(sel => sel.addEventListener('change', () => { st.items[+sel.dataset.i].moment = sel.value; draw(); }));
    };
    draw();
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-pe]'); if (!b) return;
      const a = b.dataset.pe;
      if (a === 'close') closeSheet();
      else if (a === 'rm') { st.items.splice(+b.dataset.i, 1); draw(); }
      else if (a === 'add') openFoodSearch(null, { plan: true, pick: item => { st.items.push({ id: uid(), ...item }); draw(); } });
      else if (a === 'save') {
        const items = st.items.filter(it => it.qty > 0).map(it => ({ id: it.id, name: it.name, qty: Math.round(it.qty * 100) / 100, unit: it.unit, base: it.base, n: it.n, moment: it.moment, mealId: it.mealId || null }));
        S.diet.plan = { created: S.diet.plan && S.diet.plan.created && planItems().length ? S.diet.plan.created : todayKey(), items };
        save(); closeSheet(); refresh();
        toast(items.length ? `Diète enregistrée · ${items.length} ligne${items.length > 1 ? 's' : ''}` : 'Diète vidée');
      }
    });
  }, true);
}

/* ---------- Repas composés (meal prep) ---------- */
const itemTot = it => ({ kcal: it.n.kcal * it.qty / it.base, p: it.n.p * it.qty / it.base, c: it.n.c * it.qty / it.base, f: it.n.f * it.qty / it.base });
function mealTotal(m) {
  const t = { kcal: 0, p: 0, c: 0, f: 0 };
  m.items.forEach(it => { const x = itemTot(it); t.kcal += x.kcal; t.p += x.p; t.c += x.c; t.f += x.f; });
  return t;
}
const mealPer = m => { const t = mealTotal(m), n = m.portions || 1; return { kcal: r1(t.kcal / n), p: r1(t.p / n), c: r1(t.c / n), f: r1(t.f / n) }; };
const mealAsFood = m => ({ name: m.name, unit: 'portion', base: 1, n: mealPer(m), src: 'meal', mealId: m.id, portions: m.portions, key: norm(m.name) });

// Liste « Mes repas »
function openMeals(k) {
  openSheet('', (el, w) => {
    const draw = () => {
      const list = [...S.diet.meals].sort((a, b) => (b.used || 0) - (a.used || 0) || a.name.localeCompare(b.name));
      el.innerHTML = `<div class="shead"><button class="iconbtn" data-m="close" aria-label="Fermer">${I.close}</button><h2 style="margin:0">Mes repas</h2><span style="width:42px"></span></div>
        <div class="mute small" style="margin:-6px 0 14px;line-height:1.45">Compose un plat avec tes aliments, divise-le en portions, puis ajoute une portion à ton journal chaque jour.</div>
        <button class="btn" data-m="new">+ Créer un repas</button>
        ${list.length ? list.map(m => {
          const pp = mealPer(m), t = mealTotal(m);
          return `<div class="mealcard"><button class="mc-body" data-m="edit" data-id="${m.id}">
              <div class="fname">🍲 ${esc(m.name)}</div>
              <small>${m.items.length} ingrédient${m.items.length > 1 ? 's' : ''} · ${fmtNum(r0(t.kcal))} kcal au total · ${m.portions} portion${m.portions > 1 ? 's' : ''}</small>
              <div class="mc-per"><b>${fmtNum(r0(pp.kcal))} kcal</b><span>/ portion · P ${fmtG(pp.p)} · G ${fmtG(pp.c)} · L ${fmtG(pp.f)}</span></div></button>
            <button class="gadd" data-m="add" data-id="${m.id}">+ 1 portion</button></div>`;
        }).join('') : `<div class="fempty" style="text-align:center;padding:26px 6px">Aucun repas pour l’instant.</div>`}`;
    };
    w._refresh = draw; draw();
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-m]'); if (!b) return;
      const a = b.dataset.m, m = S.diet.meals.find(x => x.id === b.dataset.id);
      if (a === 'close') closeSheet();
      else if (a === 'new') openMealEditor(null);
      else if (a === 'edit' && m) openMealEditor(m);
      else if (a === 'add' && m) openPortion(mealAsFood(m), { date: k, moment: defaultMoment(), fromSearch: true });
    });
  }, true);
}

// Création / modification d'un repas
function openMealEditor(meal) {
  const isNew = !meal;
  const st = meal ? { name: meal.name, portions: meal.portions, items: meal.items.map(it => ({ ...it, n: { ...it.n } })) } : { name: '', portions: 4, items: [] };
  openSheet('', (el, w) => {
    const totals = () => {
      const t = mealTotal(st), n = st.portions || 1;
      const box = (label, v) => `<div class="mtot"><span>${label}</span><div class="ptot" style="margin-top:6px">
        <div><b>${fmtNum(r0(v.kcal))}</b><span>kcal</span></div>${MACROS.map(([key, l, col]) => `<div style="--mc:${col}"><b>${fmtG(v[key])}</b><span>${l} (g)</span></div>`).join('')}</div></div>`;
      return box('Total du plat', t) + box(`Par portion (÷ ${n})`, { kcal: t.kcal / n, p: t.p / n, c: t.c / n, f: t.f / n });
    };
    const draw = () => {
      el.innerHTML = `<div class="shead"><button class="iconbtn" data-e="close" aria-label="Fermer">${I.close}</button>
          <h2 style="margin:0">${isNew ? 'Nouveau repas' : 'Modifier le repas'}</h2><span style="width:42px"></span></div>
        <div class="field"><label class="l" for="mn">Nom du repas</label>
          <input class="inp" id="mn" maxlength="80" autocomplete="off" placeholder="Ex : Poulet riz brocolis, chili con carne…" value="${esc(st.name)}"></div>
        <span class="l">Ingrédients (pour tout le plat)</span>
        <div class="ilist">${st.items.length ? st.items.map((it, i) => { const x = itemTot(it);
          return `<div class="irow"><div class="iname"><div class="fname">${esc(it.name)}</div><small id="ik${i}">${fmtNum(r0(x.kcal))} kcal · P ${fmtG(x.p)} · G ${fmtG(x.c)} · L ${fmtG(x.f)}</small></div>
            ${it.manual ? `<button class="iedit" data-e="editManual" data-i="${i}">✎ à la main</button>`
              : `<input class="inp iq" data-i="${i}" inputmode="decimal" autocomplete="off" value="${String(it.qty).replace('.', ',')}"><span class="iu">${esc(it.unit === 'portion' ? 'port.' : it.unit)}</span>`}
            <button class="act del" data-e="rm" data-i="${i}" aria-label="Retirer">${I.close}</button></div>`; }).join('')
          : `<div class="fempty">Ajoute les aliments de ta recette avec leurs quantités totales (ex. 600 g de riz cru, 1 kg de poulet). Si un aliment est introuvable, ou pour saisir directement les totaux du plat, utilise « Macros à la main ».</div>`}</div>
        <div class="iadd"><button class="qnone" data-e="addItem">+ Ingrédient</button><button class="qnone" data-e="addManual">✎ Macros à la main</button></div>
        <span class="l" style="margin-top:18px">Nombre de portions</span>
        <div class="durpick"><button data-e="pm">−</button><b>${st.portions} portion${st.portions > 1 ? 's' : ''}</b><button data-e="pp">+</button></div>
        <div id="mtots">${totals()}</div>
        ${isNew ? '' : '<div class="mute small" style="margin-top:10px">Modifier le repas ne change pas les portions déjà notées dans ton journal.</div>'}
        <button class="btn" data-e="save">${isNew ? 'Créer le repas' : 'Enregistrer'}</button>
        ${isNew ? '' : '<button class="btn danger" data-e="delete">Supprimer le repas</button>'}`;
      $('#mn', el).addEventListener('input', e => { st.name = e.target.value; });
      el.querySelectorAll('.iq').forEach(inp => inp.addEventListener('input', () => {
        const i = +inp.dataset.i, v = parseFloat(inp.value.replace(',', '.'));
        if (!(v >= 0)) return;
        st.items[i].qty = v;
        const x = itemTot(st.items[i]);
        $('#ik' + i, el).textContent = `${fmtNum(r0(x.kcal))} kcal · P ${fmtG(x.p)} · G ${fmtG(x.c)} · L ${fmtG(x.f)}`;
        $('#mtots', el).innerHTML = totals();
      }));
    };
    draw();
    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-e]'); if (!b) return;
      const a = b.dataset.e;
      if (a === 'close') closeSheet();
      else if (a === 'rm') { st.items.splice(+b.dataset.i, 1); draw(); }
      else if (a === 'addItem') openFoodSearch(null, { pick: item => { st.items.push(item); draw(); } });
      else if (a === 'addManual') openManualItem(null, item => { st.items.push(item); draw(); });
      else if (a === 'editManual') { const i = +b.dataset.i; openManualItem(st.items[i], item => { if (item) st.items[i] = item; else st.items.splice(i, 1); draw(); }); }
      else if (a === 'pm') { st.portions = Math.max(1, st.portions - 1); draw(); }
      else if (a === 'pp') { st.portions = Math.min(100, st.portions + 1); draw(); }
      else if (a === 'save') {
        const name = st.name.trim();
        if (!name) { const i = $('#mn', el); i.classList.add('shake'); i.focus(); setTimeout(() => i.classList.remove('shake'), 600); toast('Donne un nom à ton repas'); return; }
        if (!st.items.length) { toast('Ajoute au moins un ingrédient'); return; }
        const items = st.items.filter(it => it.qty > 0).map(it => ({ name: it.name, qty: Math.round(it.qty * 100) / 100, unit: it.unit, base: it.base, n: it.n, manual: it.manual === true }));
        if (!items.length) { toast('Indique les quantités des ingrédients'); return; }
        if (isNew) S.diet.meals.push({ id: uid(), name, portions: st.portions, items, used: Date.now(), created: Date.now() });
        else Object.assign(meal, { name, portions: st.portions, items });
        save(); closeSheet(); refresh();
        const pp = mealPer(isNew ? S.diet.meals[S.diet.meals.length - 1] : meal);
        toast(`${isNew ? 'Repas créé' : 'Repas enregistré'} · ${fmtNum(r0(pp.kcal))} kcal par portion`);
      }
      else if (a === 'delete') {
        const ok = await confirmBox('Supprimer ce repas ?', `« ${meal.name} » sera retiré de tes repas. Les portions déjà notées dans ton journal restent.`, 'Supprimer');
        if (!ok) return;
        const i = S.diet.meals.indexOf(meal); if (i >= 0) S.diet.meals.splice(i, 1);
        save(); closeSheet(2); refresh();
        toast(`« ${meal.name} » supprimé`, 'Annuler', () => { S.diet.meals.splice(Math.max(0, i), 0, meal); save(); refresh(); });
      }
    });
  }, true);
}

// Ligne de repas saisie à la main : nom + calories et macros pour la quantité utilisée (ou pour tout le plat)
function openManualItem(item, cb) {
  const v0 = k => item ? String(item.n[k]).replace('.', ',') : '';
  // Si les calories avaient été calculées depuis les macros, on laisse le champ vide pour qu'elles se recalculent
  const autoK = item && item.n.kcal === Math.round(item.n.p * 4 + item.n.c * 4 + item.n.f * 9);
  const st = { name: item ? item.name : '', kcal: autoK ? '' : v0('kcal'), p: v0('p'), c: v0('c'), f: v0('f') };
  const val = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : null; };
  openSheet('', el => {
    const calc = () => r0((val(st.p) || 0) * 4 + (val(st.c) || 0) * 4 + (val(st.f) || 0) * 9);
    const hint = () => {
      const m = calc();
      if (!m && val(st.kcal) === null) return 'Remplis au moins les calories ou une macro.';
      if (val(st.kcal) === null) return `Calories laissées vides : ${fmtNum(m)} kcal seront calculées depuis les macros.`;
      return m ? `Tes macros font ${fmtNum(m)} kcal (protéines et glucides ×4, lipides ×9).` : '';
    };
    el.innerHTML = `<div class="grab"></div><h2>${item ? 'Modifier les macros' : '✎ Macros à la main'}</h2>
      <div class="mute small" style="margin-bottom:14px;line-height:1.45">Indique les valeurs pour la quantité utilisée dans le plat. Pour saisir directement les totaux de tout le repas, mets les macros du plat entier : elles seront divisées par le nombre de portions.</div>
      <div class="field"><label class="l" for="mi_n">Nom (facultatif)</label>
        <input class="inp" id="mi_n" maxlength="80" autocomplete="off" placeholder="Ex : Sauce maison, Total du plat…" value="${esc(st.name)}"></div>
      <div class="goalgrid">
        <div><label class="l" for="mi_kcal">Calories (kcal)</label><input class="inp" id="mi_kcal" inputmode="decimal" autocomplete="off" placeholder="auto" value="${esc(st.kcal)}"></div>
        <div><label class="l" for="mi_p">Protéines (g)</label><input class="inp" id="mi_p" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(st.p)}"></div>
        <div><label class="l" for="mi_c">Glucides (g)</label><input class="inp" id="mi_c" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(st.c)}"></div>
        <div><label class="l" for="mi_f">Lipides (g)</label><input class="inp" id="mi_f" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(st.f)}"></div></div>
      <div class="mute small" id="mi_hint" style="margin-top:10px">${hint()}</div>
      <button class="btn" data-mi="save">${item ? 'Enregistrer' : 'Ajouter au repas'}</button>
      ${item ? '<button class="btn danger" data-mi="remove">Retirer du repas</button>' : ''}`;
    el.addEventListener('input', e => {
      const k = e.target.id.replace('mi_', '');
      if (k === 'n') st.name = e.target.value; else if (k in st) st[k] = e.target.value;
      $('#mi_hint', el).textContent = hint();
    });
    setTimeout(() => { try { $(item ? '#mi_kcal' : '#mi_n', el).focus(); } catch (e) {} }, 320);
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-mi]'); if (!b) return;
      if (b.dataset.mi === 'remove') { cb(null); closeSheet(); return; }
      for (const k of ['kcal', 'p', 'c', 'f']) if (String(st[k]).trim() !== '' && val(st[k]) === null) { toast('Vérifie les valeurs : uniquement des nombres'); return; }
      const n = { p: r1(val(st.p) || 0), c: r1(val(st.c) || 0), f: r1(val(st.f) || 0) };
      n.kcal = val(st.kcal) !== null ? r0(val(st.kcal)) : calc();
      if (!n.kcal && !n.p && !n.c && !n.f) { toast('Indique au moins les calories ou une macro'); return; }
      cb({ name: st.name.trim() || 'Macros à la main', qty: 1, unit: 'portion', base: 1, n, manual: true });
      closeSheet();
    });
  });
}

/* ---------- Ajout rapide : un repas noté directement avec ses calories et ses macros ---------- */
function openQuick(k, entry, ctx) {

    : { name: '', kcal: '', p: '', c: '', f: '', moment: ctx.moment || defaultMoment(), keep: false };
  const val = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) && n >= 0 ? n : null; };
  openSheet('', el => {
    const calc = () => r0((val(st.p) || 0) * 4 + (val(st.c) || 0) * 4 + (val(st.f) || 0) * 9);
    const hint = () => {
      const m = calc(), k2 = val(st.kcal);
      if (!m) return 'Remplis au moins les calories ou une macro.';
      if (k2 === null) return `Calories laissées vides : ${fmtNum(m)} kcal seront calculées depuis les macros.`;

    };
    el.innerHTML = `<div class="grab"></div><h2>${entry ? 'Modifier le repas' : '⚡ Ajout rapide'}</h2>

      <div class="field"><label class="l" for="qn">Nom (facultatif)</label>
        <input class="inp" id="qn" maxlength="80" autocomplete="off" placeholder="Ex : Resto midi, burger, repas chez des amis…" value="${esc(st.name)}"></div>
      <div class="goalgrid">
        <div><label class="l" for="qk">Calories (kcal)</label><input class="inp" id="qk" inputmode="decimal" autocomplete="off" placeholder="auto" value="${esc(st.kcal)}"></div>
        <div><label class="l" for="qp">Protéines (g)</label><input class="inp" id="qp" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(st.p)}"></div>
        <div><label class="l" for="qc">Glucides (g)</label><input class="inp" id="qc" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(st.c)}"></div>
        <div><label class="l" for="qf">Lipides (g)</label><input class="inp" id="qf" inputmode="decimal" autocomplete="off" placeholder="0" value="${esc(st.f)}"></div></div>
      <div class="mute small" id="qhint" style="margin-top:10px">${hint()}</div>
      <span class="l" style="margin-top:16px">Moment</span>
      <div class="momchips" id="qmoms"></div>
      ${entry ? '' : `<label class="keep"><input type="checkbox" id="qkeep"> Garder dans mes aliments pour le réutiliser</label>`}
      <button class="btn" data-q="save">${entry ? 'Enregistrer' : 'Ajouter au journal'}</button>
      ${entry ? '<button class="btn danger" data-q="delete">Retirer du journal</button>' : ''}`;
    const drawMoms = () => { $('#qmoms', el).innerHTML = MOMENTS.map(([id, l, ic]) => `<button data-q="moment" data-v="${id}" class="${st.moment === id ? 'on' : ''}">${ic} ${l}</button>`).join(''); };
    drawMoms();
    const ids = { qn: 'name', qk: 'kcal', qp: 'p', qc: 'c', qf: 'f' };
    el.addEventListener('input', e => { if (ids[e.target.id]) { st[ids[e.target.id]] = e.target.value; $('#qhint', el).textContent = hint(); } });
    el.addEventListener('change', e => { if (e.target.id === 'qkeep') st.keep = e.target.checked; });
    if (!entry) setTimeout(() => { try { $('#qn', el).focus(); } catch (e) {} }, 320);
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-q]'); if (!b) return;
      const a = b.dataset.q;
      if (a === 'moment') { st.moment = b.dataset.v; drawMoms(); return; }
      if (a === 'delete') {
        const list = S.diet.log[k] || [], i = list.indexOf(entry);
        if (i >= 0) list.splice(i, 1);
        if (!list.length) delete S.diet.log[k];
        save(); closeSheet(); refresh();
        toast(`« ${entry.name} » retiré`, 'Annuler', () => { (S.diet.log[k] = S.diet.log[k] || []).splice(Math.max(0, i), 0, entry); save(); refresh(); });
        return;
      }
      if (a !== 'save') return;
      for (const key of ['kcal', 'p', 'c', 'f']) {
        if (String(st[key]).trim() !== '' && val(st[key]) === null) { toast('Vérifie les valeurs : uniquement des nombres'); return; }
      }
      const n = { p: r1(val(st.p) || 0), c: r1(val(st.c) || 0), f: r1(val(st.f) || 0) };
      n.kcal = val(st.kcal) !== null ? r0(val(st.kcal)) : calc();
      if (!n.kcal && !n.p && !n.c && !n.f) { toast('Indique au moins les calories ou une macro'); return; }
      const name = st.name.trim() || 'Repas rapide';
      if (entry) {
        Object.assign(entry, { name, qty: 1, unit: 'portion', base: 1, n, moment: st.moment });
        save(); closeSheet(); refresh(); toast('Repas modifié'); return;
      }
      let foodId = null;
      if (st.keep) {
        const same = S.diet.foods.find(x => norm(x.name) === norm(name));
        if (same) { Object.assign(same, { unit: 'portion', base: 1, n: { ...n }, used: Date.now() }); foodId = same.id; }
        else { const nf = { id: uid(), name, unit: 'portion', base: 1, n: { ...n }, src: 'mine', brand: '', serving: null, moment: st.moment, used: Date.now() }; S.diet.foods.push(nf); foodId = nf.id; }
      }
      const e2 = { id: uid(), name, qty: 1, unit: 'portion', base: 1, n, moment: st.moment, foodId, quick: true };
      (S.diet.log[k] = S.diet.log[k] || []).push(e2);
      save(); closeSheet(ctx.fromSearch ? 2 : 1); refresh();
      toast(`Ajouté · ${fmtNum(n.kcal)} kcal`, 'Annuler', () => { const l = S.diet.log[k] || []; const j = l.indexOf(e2); if (j >= 0) l.splice(j, 1); if (!l.length) delete S.diet.log[k]; save(); refresh(); });
    });
  });
}
function openEntry(k, id) {
  const e = (S.diet.log[k] || []).find(x => x.id === id); if (!e) return;
  if (e.quick) { openQuick(k, e, {}); return; }
  openPortion({ name: e.name, unit: e.unit, base: e.base, n: e.n, src: 'entry' }, { date: k, entry: e });
}

/* ---------- Import du suivi de diète (fichier « lockin-diet ») : fusion ---------- */
function importDiet(data) {
  const clean = sanitizeDiet({ goals: data.goals, goalsSet: true, foods: (data.foods || []).map(f => ({ ...f, src: 'mine' })), log: data.log, plan: data.plan });
  const weights = data.weights && typeof data.weights === 'object' ? Object.entries(data.weights).filter(([k, v]) => /^\d{4}-\d{2}-\d{2}$/.test(k) && typeof v === 'number' && v > 0 && v < 500) : [];
  // Objectifs : remplacés seulement si le fichier en contient
  if (data.goals && typeof data.goals === 'object') { S.diet.goals = clean.goals; S.diet.goalsSet = true; }
  // Diète : remplacée si le fichier en contient une
  let np = 0;
  if (data.plan && Array.isArray(data.plan.items)) {
    S.diet.plan = { created: S.diet.plan && S.diet.plan.created && planItems().length ? S.diet.plan.created : todayKey(), items: clean.plan.items };
    np = clean.plan.items.length;
  }
  let nf = 0, ne = 0;
  clean.foods.forEach(f => { if (!S.diet.foods.some(x => norm(x.name) === norm(f.name))) { S.diet.foods.push(f); nf++; } });
  Object.entries(clean.log).forEach(([k, list]) => {
    const cur = S.diet.log[k] = S.diet.log[k] || [];
    const sig = e => `${norm(e.name)}|${e.qty}|${r1(e.n.kcal)}|${e.moment}`;
    const seen = new Set(cur.map(sig));
    list.forEach(e => { if (!seen.has(sig(e))) { cur.push(e); ne++; } });
  });
  let h = weightHabit();
  if (weights.length && !h) { createWeightHabit(); h = weightHabit(); }
  weights.forEach(([k, v]) => { if (h.history[k] === undefined) h.history[k] = v; if (k < h.start) h.start = k; });
  save(); refresh();
  return { nf, ne, nw: weights.length, np };
}

/* =====================================================================
   SOMMEIL : heure de coucher / de lever, objectifs, respect des objectifs
   ===================================================================== */
let sleepView = todayKey();
const tMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const tStr = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const fmtTime = t => t.replace(':', ' h ');
const fmtDur = m => { m = Math.round(m); const h = Math.floor(m / 60), mm = m % 60; return h === 0 ? `${mm} min` : mm ? `${h} h ${pad(mm)}` : `${h} h`; };
const fmtGap = m => { m = Math.round(Math.abs(m)); return m < 60 ? `${m} min` : fmtDur(m); };
// Heures du soir sur un axe continu : 12:00 → 0, 23:00 → 660, 01:00 → 780
const bedAxis = t => (tMin(t) - 720 + 1440) % 1440;
// Durée de la nuit (coucher la veille ou après minuit)
const nightDur = n => { const b = tMin(n.bed), w = tMin(n.wake); return b < w ? w - b : w + 1440 - b; };
function nightCheck(n) {
  const g = S.sleep.goals, d = nightDur(n);
  const bedLate = bedAxis(n.bed) - bedAxis(g.bed);            // > 0 : couché plus tard que prévu
  const wakeLate = tMin(n.wake) - tMin(g.wake);               // > 0 : levé plus tard que prévu
  const ok = { dur: d >= g.dur - g.tol, bed: bedLate <= g.tol, wake: Math.abs(wakeLate) <= g.tol };
  return { d, bedLate, wakeLate, ok, score: (ok.dur ? 1 : 0) + (ok.bed ? 1 : 0) + (ok.wake ? 1 : 0) };
}
// Ressenti de la nuit — questions du Consensus Sleep Diary (Carney et al., Sleep 2012)
const SQ = [['😫', 'Très mauvaise'], ['😕', 'Mauvaise'], ['😐', 'Moyenne'], ['🙂', 'Bonne'], ['😄', 'Très bonne']];
const SR = [['😵', 'Pas du tout'], ['🥱', 'Un peu'], ['😐', 'Moyen'], ['🙂', 'Bien'], ['💪', 'Très bien']];
const SL = ['< 15 min', '15–30 min', '30–60 min', '> 1 h'];
const SA = ['Aucun', '1', '2', '3 ou +'];
// Note sur 10 = qualité (1 à 5) + sensation de repos au réveil (1 à 5)
const nightNote = n => n && n.q && n.r ? n.q + n.r : null;
const noteColor = v => v >= 8 ? '#818CF8' : v >= 5 ? '#FBBF24' : '#FB923C';
const fmtNote = v => (Math.round(v * 10) / 10).toString().replace('.', ',');
const nightLabel = k => `Nuit du ${parse(addDays(k, -1)).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric' })} au ${fmtShort(k)}`;

function vSleep() {
  const t = todayKey(), k = sleepView, isT = k === t, n = S.sleep.log[k], g = S.sleep.goals;
  let html = `<div class="top"><div><div class="eyebrow">${nightLabel(k)}</div><h1>Sommeil</h1></div>
    <button class="iconbtn" data-act="settings" aria-label="Réglages">${I.gear}</button></div>
    <div class="daynav" style="margin-top:0"><button class="arrow" data-act="sleepPrev" aria-label="Nuit précédente">${I.left}</button>
      <div class="lbl">${isT ? 'Cette nuit' : k === addDays(t, -1) ? 'La nuit d’avant' : fmtShort(k)}${isT ? '' : `<button data-act="sleepToday">Revenir à cette nuit</button>`}</div>
      <button class="arrow" data-act="sleepNext" aria-label="Nuit suivante" ${isT ? 'disabled' : ''}>${I.right}</button></div>
    <div class="sec-row" style="margin:16px 2px 8px"><span class="mute small" style="font-weight:700">Objectif ${fmtDur(g.dur)} · coucher ${fmtTime(g.bed)} · lever ${fmtTime(g.wake)} · marge ${g.tol} min</span><button data-act="sleepGoals">Objectifs</button></div>`;
  if (!n) {
    html += `<div class="ncard sleep-empty"><div style="font-size:34px">🌙</div><b>Pas encore renseignée</b>
      <span class="mute small">À quelle heure t’es-tu couché et levé, et comment as-tu dormi ?</span>
      <button class="btn" data-act="sleepNight">Renseigner ma nuit</button></div>`;
  } else {
    const c = nightCheck(n);
    const badge = (ok, label, detail) => `<div class="sbadge ${ok ? 'ok' : 'ko'}"><b>${ok ? '✓' : '✗'} ${label}</b><span>${detail}</span></div>`;
    html += `<button class="ncard sleep-night" data-act="sleepNight">
      <div class="snk"><div><b>${fmtDur(c.d)}</b><span> / ${fmtDur(g.dur)}</span></div><div class="sscore s${c.score}">${c.score}/3</div></div>
      <div class="stimes"><span>🌙 ${fmtTime(n.bed)}</span><i></i><span>☀️ ${fmtTime(n.wake)}</span></div>
      <div class="sbadges">
        ${badge(c.ok.dur, 'Durée', c.d === g.dur ? 'pile' : c.d > g.dur ? `${fmtGap(c.d - g.dur)} de plus` : `il manque ${fmtGap(g.dur - c.d)}`)}
        ${badge(c.ok.bed, 'Coucher', c.bedLate === 0 ? 'à l’heure' : c.bedLate < 0 ? `${fmtGap(c.bedLate)} plus tôt` : `${fmtGap(c.bedLate)} plus tard`)}
        ${badge(c.ok.wake, 'Lever', c.wakeLate === 0 ? 'à l’heure' : c.wakeLate < 0 ? `${fmtGap(c.wakeLate)} plus tôt` : `${fmtGap(c.wakeLate)} plus tard`)}
      </div>${nightFeel(n)}<div class="mute small" style="margin-top:10px;text-align:center">Touche pour modifier</div></button>`;
  }
  return html + nightAnalysis(k) + sleepDayCard(k) + napDayCard(k, n) + weekAnalysis(k) + sleepStats(k);
}
// Bloc « ressenti » de la carte de la nuit
function nightFeel(n) {
  const v = nightNote(n);
  if (!v && !n.q && !n.r) return `<div class="sfeel empty">⭐ Note ta nuit pour suivre la qualité de ton sommeil</div>`;
  const extra = [n.l !== undefined ? `endormi en ${SL[n.l]}` : '', n.a !== undefined ? (n.a === 0 ? 'aucun réveil' : `${SA[n.a]} réveil${n.a > 1 ? 's' : ''}`) : ''].filter(Boolean).join(' · ');
  return `<div class="sfeel">
    ${v ? `<div class="snote" style="background:${noteColor(v)}">${v}<small>/10</small></div>` : `<div class="snote half">?<small>/10</small></div>`}
    <div><b>${n.q ? `${SQ[n.q - 1][0]} Sommeil de ${SQ[n.q - 1][1].toLowerCase()} qualité` : 'Qualité non notée'}</b>
      <span>${n.r ? `Reposé au réveil : ${SR[n.r - 1][1].toLowerCase()}` : 'Repos au réveil non noté'}${extra ? ' · ' + extra : ''}</span>
      ${n.note ? `<span class="snotetxt">« ${esc(n.note)} »</span>` : ''}</div></div>`;
}

// Statistiques sur 7 / 14 / 30 nuits finissant à la nuit affichée
function sleepStats(k) {
  const range = S.sleep.range || 14, g = S.sleep.goals;
  const days = []; for (let i = range - 1; i >= 0; i--) days.push(addDays(k, -i));
  const nights = days.map(d => S.sleep.log[d] ? { k: d, n: S.sleep.log[d], c: nightCheck(S.sleep.log[d]) } : { k: d });
  const got = nights.filter(x => x.n);
  let html = `<div class="section sec-row"><span>Suivi</span><span class="mute small" style="text-transform:none;letter-spacing:0;font-weight:600">touche une barre pour voir la nuit</span></div>
    <div class="ncard"><div class="seg small-seg">${[[7, '7 nuits'], [14, '14 nuits'], [30, '30 nuits']].map(([v, l]) => `<button data-act="sleepRange" data-v="${v}" class="${range === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  if (!got.length) return html + `<div class="mute small" style="text-align:center;padding:16px 0 6px">Aucune nuit renseignée sur cette période.</div></div>` + napStats(days, k, range);
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const avgDur = avg(got.map(x => x.c.d));
  const avgBed = tStr(avg(got.map(x => bedAxis(x.n.bed))) + 720), avgWake = tStr(avg(got.map(x => tMin(x.n.wake))));
  const full = got.filter(x => x.c.score === 3).length;
  // Série de nuits consécutives où les 3 objectifs sont respectés (en partant de la nuit affichée)
  let streak = 0; for (let i = nights.length - 1; i >= 0; i--) { if (nights[i].n && nights[i].c.score === 3) streak++; else break; }
  html += `<div class="wstats" style="grid-template-columns:1fr 1fr;margin-top:4px">
      <div><b>${fmtDur(avgDur)}</b><span>durée moyenne (objectif ${fmtDur(g.dur)})</span></div>
      <div><b>${full} / ${got.length}</b><span>nuits avec les 3 objectifs</span></div>
      <div><b>${fmtTime(avgBed)}</b><span>coucher moyen (objectif ${fmtTime(g.bed)})</span></div>
      <div><b>${fmtTime(avgWake)}</b><span>lever moyen (objectif ${fmtTime(g.wake)})</span></div></div>`;
  if (streak) html += `<div class="pace" style="margin-top:0">🔥 Série en cours : <b>${streak} nuit${streak > 1 ? 's' : ''}</b> avec tous les objectifs</div>`;
  // Taux de respect par objectif
  html += `<div class="srates">${[['dur', 'Durée'], ['bed', 'Coucher'], ['wake', 'Lever']].map(([key, l]) => {
    const n = got.filter(x => x.c.ok[key]).length, p = n / got.length;
    return `<div><span>${l}</span><div class="mbar"><i style="width:${(p * 100).toFixed(0)}%;background:${p >= .8 ? 'var(--accent)' : p >= .5 ? '#FBBF24' : '#FB923C'}"></i></div><b>${n}/${got.length}</b></div>`;
  }).join('')}</div>`;
  html += `<div class="subhead" style="margin-top:18px">Durée de chaque nuit</div>` + sleepDurChart(nights, k);
  html += `<div class="subhead">Horaires de coucher et de lever</div>` + sleepWindowChart(nights, k);
  html += `<div class="legend" style="margin-top:8px"><span><i style="background:#818CF8"></i>Objectifs respectés</span><span><i style="background:#FBBF24"></i>1 ou 2 objectifs</span><span><i style="background:#FB923C"></i>Aucun</span></div></div>`;
  return html + sleepQuality(nights, k, range) + napStats(days, k, range);
}

// Qualité ressentie : moyenne, évolution, ce qui l'influence
function sleepQuality(nights, k, range) {
  const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
  const rated = nights.filter(x => x.n && nightNote(x.n));
  let html = `<div class="section">Qualité de mes nuits</div><div class="ncard">`;
  if (!rated.length) return html + `<div class="mute small" style="text-align:center;padding:10px 0 4px">Aucune nuit notée sur cette période.<br>Quand tu renseignes une nuit, réponds aux deux questions « Comment as-tu dormi ? » et « Au réveil, tu te sentais… » : elles donnent une note sur 10.</div></div>`;
  const m = avg(rated.map(x => nightNote(x.n)));
  // Même nombre de nuits juste avant la période affichée
  const prev = []; for (let i = range; i < range * 2; i++) { const n = S.sleep.log[addDays(k, -i)]; if (n && nightNote(n)) prev.push(nightNote(n)); }
  let trend = '';
  if (prev.length >= 3 && rated.length >= 3) {
    const d = m - avg(prev);
    trend = Math.abs(d) < 0.3 ? `<span class="strend">= stable par rapport aux ${range} nuits d’avant (${fmtNote(avg(prev))}/10)</span>`
      : `<span class="strend ${d > 0 ? 'up' : 'down'}">${d > 0 ? '▲ en progrès' : '▼ en baisse'} : ${d > 0 ? '+' : '−'}${fmtNote(Math.abs(d))} par rapport aux ${range} nuits d’avant (${fmtNote(avg(prev))}/10)</span>`;
  } else trend = `<span class="strend">L’évolution s’affichera quand tu auras noté au moins 3 nuits sur la période précédente.</span>`;
  const mq = avg(rated.map(x => x.n.q)), mr = avg(rated.map(x => x.n.r));
  html += `<div class="sqtop"><div class="snote big" style="background:${noteColor(m)}">${fmtNote(m)}<small>/10</small></div>
    <div><b>Note moyenne</b><span>${rated.length} nuit${rated.length > 1 ? 's' : ''} notée${rated.length > 1 ? 's' : ''} sur ${range}</span>${trend}</div></div>
    <div class="wstats" style="grid-template-columns:1fr 1fr">
      <div><b>${fmtNote(mq)} / 5</b><span>qualité du sommeil · ${SQ[Math.round(mq) - 1][1].toLowerCase()}</span></div>
      <div><b>${fmtNote(mr)} / 5</b><span>repos au réveil · ${SR[Math.round(mr) - 1][1].toLowerCase()}</span></div></div>`;
  // Endormissement et réveils, si renseignés
  const withL = nights.filter(x => x.n && x.n.l !== undefined), withA = nights.filter(x => x.n && x.n.a !== undefined);
  if (withL.length || withA.length) {
    const cnt = withL.reduce((c, x) => (c[x.n.l]++, c), [0, 0, 0, 0]), top = cnt.indexOf(Math.max(...cnt));
    html += `<div class="wstats" style="grid-template-columns:1fr 1fr;margin-top:0">
      <div><b>${withL.length ? SL[top] : '—'}</b><span>endormissement le plus fréquent${withL.length ? ` (${cnt[top]}/${withL.length})` : ''}</span></div>
      <div><b>${withA.length ? fmtNote(avg(withA.map(x => x.n.a))) : '—'}</b><span>réveils par nuit en moyenne${withA.some(x => x.n.a === 3) ? ' (3 ou + compté 3)' : ''}</span></div></div>`;
  }
  // Ce qui joue sur la note : durée et heure de coucher
  const split = (key, yes, no) => {
    const a = rated.filter(x => x.c.ok[key]).map(x => nightNote(x.n)), b = rated.filter(x => !x.c.ok[key]).map(x => nightNote(x.n));
    if (a.length < 2 || b.length < 2) return '';
    const ma = avg(a), mb = avg(b);
    return `<div class="sqsplit"><span>${yes}</span><b style="color:${noteColor(ma)}">${fmtNote(ma)}</b><span>${no}</span><b style="color:${noteColor(mb)}">${fmtNote(mb)}</b></div>`;
  };
  const sp = split('dur', 'Durée atteinte', 'Durée trop courte') + split('bed', 'Couché à l’heure', 'Couché trop tard');
  if (sp) html += `<div class="subhead" style="margin-top:6px">Ta note selon tes objectifs</div>${sp}`;
  html += `<div class="subhead" style="margin-top:16px">Note de chaque nuit</div>` + sleepNoteChart(nights, k);
  html += `<div class="legend" style="margin-top:8px"><span><i style="background:#818CF8"></i>8 à 10</span><span><i style="background:#FBBF24"></i>5 à 7</span><span><i style="background:#FB923C"></i>2 à 4</span>${range >= 14 ? '<span><i style="background:#F2F3F5;height:3px;vertical-align:3px"></i>moyenne sur 7 nuits</span>' : ''}</div>`;
  html += `<div class="mute small" style="margin-top:12px;line-height:1.45">La note reprend les deux questions de ressenti de l’agenda du sommeil standard utilisé en recherche (<i>Consensus Sleep Diary</i>) : qualité du sommeil et sensation d’être reposé, chacune de 1 à 5. À remplir de préférence dans l’heure qui suit le lever.</div></div>`;
  return html;
}
function sleepNoteChart(nights, k) {
  const W = 340, H = 130, P = 4, B = 16, T = 10, n = nights.length, bw = (W - 2 * P) / n;

  [5, 8].forEach(v => s += `<line x1="${P}" x2="${W - P}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="#20232B"/><text x="${W - P}" y="${(y(v) - 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#5A6070">${v}</text>`);
  nights.forEach((x, i) => {
    const bx = P + i * bw + bw * 0.16, w = bw * 0.68, v = x.n && nightNote(x.n);
    s += `<g data-act="sleepDay" data-k="${x.k}" style="cursor:pointer"><rect x="${(P + i * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent"/>`;
    if (v) {
      const hh = (H - T - B) * v / 10;
      s += `<rect x="${bx.toFixed(1)}" y="${(H - B - hh).toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="${Math.min(3, w / 3).toFixed(1)}" fill="${noteColor(v)}" opacity=".9"/>`;
      if (n <= 14) s += `<text x="${(bx + w / 2).toFixed(1)}" y="${(H - B - hh + 11).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0E0F12">${v}</text>`;
      if (x.k === k) s += `<rect x="${(bx - 1.5).toFixed(1)}" y="${(H - B - hh - 1.5).toFixed(1)}" width="${(w + 3).toFixed(1)}" height="${(hh + 3).toFixed(1)}" rx="4" fill="none" stroke="#F2F3F5" stroke-width="1.5"/>`;
    } else if (x.n) s += `<text x="${(bx + w / 2).toFixed(1)}" y="${H - B - 4}" text-anchor="middle" font-size="10" fill="#5A6070">–</text>`;
    if (n <= 14 || i % 5 === 4 || x.k === k) s += `<text x="${(bx + w / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle" font-size="${n > 14 ? 9 : 10}" fill="${x.k === k ? '#F2F3F5' : '#5A6070'}" font-weight="700">${n > 14 ? parse(x.k).getDate() : LETTER[parse(x.k).getDay()]}</text>`;
    s += `</g>`;
  });
  // Moyenne glissante sur 7 nuits (nuits notées seulement)
  if (n >= 14) {
    const pts = [];
    nights.forEach((x, i) => {
      const vals = []; for (let j = 0; j < 7; j++) { const m = S.sleep.log[addDays(x.k, -j)]; if (m && nightNote(m)) vals.push(nightNote(m)); }
      if (vals.length >= 3) pts.push(`${(P + i * bw + bw / 2).toFixed(1)},${y(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1)}`);
    });
    if (pts.length > 1) s += `<polyline points="${pts.join(' ')}" fill="none" stroke="#F2F3F5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".85" pointer-events="none"/>`;
  }
  return s + `</svg>`;
}
const nightColor = c => c.score === 3 ? '#818CF8' : c.score === 0 ? '#FB923C' : '#FBBF24';
function sleepDurChart(nights, k) {
  const g = S.sleep.goals, W = 340, H = 140, P = 4, B = 16, T = 12, n = nights.length;
  const max = Math.max(g.dur + 120, ...nights.filter(x => x.n).map(x => x.c.d));
  const bw = (W - 2 * P) / n, y = v => T + (H - T - B) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  s += `<rect x="${P}" y="${y(g.dur).toFixed(1)}" width="${W - 2 * P}" height="${(y(g.dur - g.tol) - y(g.dur)).toFixed(1)}" fill="#818CF8" opacity=".08"/>`;
  s += `<line x1="${P}" x2="${W - P}" y1="${y(g.dur).toFixed(1)}" y2="${y(g.dur).toFixed(1)}" stroke="#8B90A0" stroke-dasharray="4 4"/>`;
  nights.forEach((x, i) => {
    const bx = P + i * bw + bw * 0.16, w = bw * 0.68;
    s += `<g data-act="sleepDay" data-k="${x.k}" style="cursor:pointer"><rect x="${(P + i * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent"/>`;
    if (x.n) {
      const hh = (H - T - B) * x.c.d / max;
      s += `<rect x="${bx.toFixed(1)}" y="${(H - B - hh).toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="${Math.min(3, w / 3).toFixed(1)}" fill="${nightColor(x.c)}"/>`;
      if (x.k === k) s += `<rect x="${(bx - 1.5).toFixed(1)}" y="${(H - B - hh - 1.5).toFixed(1)}" width="${(w + 3).toFixed(1)}" height="${(hh + 3).toFixed(1)}" rx="4" fill="none" stroke="#F2F3F5" stroke-width="1.5"/>`;
    }
    if (n <= 14 || i % 5 === 4 || x.k === k) s += `<text x="${(bx + w / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle" font-size="${n > 14 ? 9 : 10}" fill="${x.k === k ? '#F2F3F5' : '#5A6070'}" font-weight="700">${n > 14 ? parse(x.k).getDate() : LETTER[parse(x.k).getDay()]}</text>`;
    s += `</g>`;
  });
  s += `<text x="${P + 2}" y="${(y(g.dur) - 4).toFixed(1)}" font-size="10" fill="#8B90A0">objectif ${fmtDur(g.dur)}</text></svg>`;

}
// Fenêtre de sommeil : une barre verticale du coucher au lever, sur un axe 18 h → 14 h
function sleepWindowChart(nights, k) {
  const g = S.sleep.goals, W = 340, H = 200, L = 38, R = 6, T = 8, B = 16, n = nights.length;
  const got = nights.filter(x => x.n);
  // axe en minutes depuis midi (coucher) ; le lever est placé à +1440 s'il est le lendemain
  const pos = x => { const b = bedAxis(x.n.bed); return [b, b + nightDur(x.n)]; };
  const gb = bedAxis(g.bed), gw = gb + ((tMin(g.wake) - tMin(g.bed) + 1440) % 1440 || 1440);
  let lo = Math.min(gb, ...got.map(x => pos(x)[0])) - 30, hi = Math.max(gw, ...got.map(x => pos(x)[1])) + 30;
  lo = Math.floor(lo / 60) * 60; hi = Math.ceil(hi / 60) * 60;
  const Y = v => T + (H - T - B) * (v - lo) / (hi - lo);
  const bw = (W - L - R) / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  const step = (hi - lo) / 60 > 10 ? 120 : 60;
  for (let v = lo; v <= hi; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#20232B"/><text x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#5A6070">${tStr(v + 720).replace(':00', ' h')}</text>`;
  [[gb, 'coucher'], [gw, 'lever']].forEach(([v, l]) => {
    s += `<rect x="${L}" y="${Y(v - g.tol).toFixed(1)}" width="${W - L - R}" height="${(Y(v + g.tol) - Y(v - g.tol)).toFixed(1)}" fill="#818CF8" opacity=".07"/>
      <line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#8B90A0" stroke-dasharray="4 4"/>`;
  });
  nights.forEach((x, i) => {
    const bx = L + i * bw + bw * 0.2, w = bw * 0.6;
    s += `<g data-act="sleepDay" data-k="${x.k}" style="cursor:pointer"><rect x="${(L + i * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent"/>`;
    if (x.n) {
      const [a, b] = pos(x);
      s += `<rect x="${bx.toFixed(1)}" y="${Y(a).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(2, Y(b) - Y(a)).toFixed(1)}" rx="${Math.min(4, w / 2).toFixed(1)}" fill="${nightColor(x.c)}" opacity="${x.k === k ? 1 : .85}"/>`;
      if (x.k === k) s += `<rect x="${(bx - 1.5).toFixed(1)}" y="${(Y(a) - 1.5).toFixed(1)}" width="${(w + 3).toFixed(1)}" height="${(Y(b) - Y(a) + 3).toFixed(1)}" rx="5" fill="none" stroke="#F2F3F5" stroke-width="1.5"/>`;
    }
    if (n <= 14 || i % 5 === 4 || x.k === k) s += `<text x="${(bx + w / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle" font-size="${n > 14 ? 9 : 10}" fill="${x.k === k ? '#F2F3F5' : '#5A6070'}" font-weight="700">${n > 14 ? parse(x.k).getDate() : LETTER[parse(x.k).getDay()]}</text>`;
    s += `</g>`;
  });
  return s + `</svg><div class="mute small">Lignes pointillées : tes objectifs de coucher et de lever (zone claire = marge de ${S.sleep.goals.tol} min).</div>`;
}

/* ---------- Siestes ---------- */
// Repères tirés des études : Brooks & Lack (Sleep, 2006), Tietzel & Lack (2001), Rosekind et al. / NASA (1995),
// Reyner & Horne (1997, sieste-café), Sleep Foundation (horaires), Consensus Sleep Diary (sieste ou assoupissement)
const NAP_DUR = [10, 15, 20, 26, 30, 45, 60, 90];
const NAP_FEEL = [['😵‍💫', 'Groggy'], ['😐', 'Comme avant'], ['⚡', 'En forme']];
const napsOf = k => S.sleep.naps[k] || [];
const napMin = k => napsOf(k).reduce((a, n) => a + n.d, 0);
// Heure limite de fin de sieste : 8 h avant le coucher visé (en minutes depuis minuit du jour de la sieste)
const napLimit = () => bedAxis(S.sleep.goals.bed) + 720 - 480;
function napCheck(n) {
  const st = tMin(n.s), en = st + n.d, lim = napLimit();
  let dur;
  if (n.d < 10) dur = [1, 'Très courte', 'Moins de 10 min : effet limité. Dans l’étude de Brooks et Lack (2006), 5 min de sommeil n’apportaient presque rien.'];
  else if (n.d <= 20) dur = [2, 'Durée idéale', '10 à 20 min : regain de vigilance rapide, sans être groggy au réveil. La sieste de 10 min était la plus efficace de l’étude de Brooks et Lack.'];
  else if (n.d <= 30) dur = [2, 'Bonne durée', 'Jusqu’à 30 min : proche de la « sieste NASA » (26 min de sommeil). Un peu de lourdeur possible les premières minutes.'];
  else if (n.d < 75) dur = [0, 'Risque d’être groggy', 'Au-delà de 30 min, on entre en sommeil profond : le réveil est souvent pâteux (inertie du sommeil) avant que le bénéfice n’arrive.'];
  else if (n.d <= 110) dur = [1, 'Cycle complet', 'Autour de 90 min, un cycle complet limite la lourdeur au réveil, mais une sieste aussi longue réduit ton besoin de sommeil la nuit.'];
  else dur = [0, 'Trop longue', 'Plus de 2 h : c’est presque une seconde nuit, et elle risque de décaler ton coucher.'];
  let time;
  if (en > lim) time = [0, 'Trop tardive', `Finie à ${fmtTime(tStr(en))}, moins de 8 h avant ton coucher prévu (${fmtTime(S.sleep.goals.bed)}). Les siestes tardives rendent l’endormissement plus difficile le soir.`];
  else if (st >= 780 && st <= 900) time = [2, 'Bon moment', 'Entre 13 h et 15 h : c’est le creux naturel de début d’après-midi, le meilleur moment pour une sieste.'];
  else time = [1, 'Horaire correct', 'En dehors du creux de 13 h–15 h, mais assez tôt pour ne pas gêner ta nuit.'];
  return { dur, time, end: en, good: dur[0] === 2 && time[0] >= 1, bad: dur[0] === 0 || time[0] === 0 };
}
// Écart entre la durée réellement dormie et la durée prévue (à 5 min près = comme prévu)
const napGap = n => { if (!n.p) return null; const x = n.d - n.p; return { x, ok: Math.abs(x) <= 5, txt: Math.abs(x) <= 5 ? 'comme prévu' : x > 0 ? `${fmtDur(x)} de plus que prévu` : `${fmtDur(-x)} de moins que prévu` }; };
const lvlColor = l => l === 2 ? '#818CF8' : l === 1 ? '#FBBF24' : '#FB923C';
const napColor = c => c.good ? '#818CF8' : c.bad ? '#FB923C' : '#FBBF24';

function napDayCard(k, night) {
  const naps = napsOf(k), on = S.sleep.napOn, isT = k === todayKey();
  let html = `<div class="section sec-row"><span>Siestes · ${isT ? 'aujourd’hui' : fmtShort(k)}</span><button data-act="napTips">Bien faire sa sieste</button></div><div class="ncard">`;

      <span>Commencée à ${fmtTime(on.s)} · réveil conseillé vers ${fmtTime(tStr(tMin(on.s) + 5 + (on.p || 20)))} (≈ 5 min pour t’endormir + ${fmtDur(on.p || 20)} de sieste${on.p ? ' prévue' : ''})</span></div></div>
      <div class="ncard-actions"><button class="btn" data-act="napStop">☀️ Je suis réveillé</button><button class="gadd" data-act="napCancel">Annuler</button></div>`;

        <div><b>${n.t ? '💤 Assoupi' : '😴 Sieste'} de ${fmtDur(n.d)}${n.p ? ` <small class="mute">· prévu ${fmtDur(n.p)}</small>` : ''}${n.c ? ' ☕' : ''}</b>
          <span>${fmtTime(n.s)} → ${fmtTime(tStr(c.end))}${n.p ? ` · <em class="${napGap(n).ok ? 'gok' : napGap(n).x > 0 ? 'gko' : 'gun'}">${napGap(n).txt}</em>` : ''} · ${c.dur[1].toLowerCase()} · ${c.time[1].toLowerCase()}${n.f ? ` · ${NAP_FEEL[n.f - 1][0]} ${NAP_FEEL[n.f - 1][1].toLowerCase()} au réveil` : ''}</span></div></button>`;
    }).join('');

  return html + `</div>`;
}

function openNap(k, idx, preset) {

          ${st.p ? '' : '<div class="mute small" style="margin-top:6px">Facultatif. Touche à nouveau une durée pour l’enlever.</div>'}</div>`}
        <div class="goalgrid">
          <div><label class="l" for="ps">Début</label><input class="inp big" id="ps" type="time" value="${st.s}"></div>
          <div><label class="l" for="pe">Fin</label><input class="inp big" id="pe" type="time" value="${tStr(c.end)}"></div></div>
        <div class="mute small" style="margin-top:8px">Indique le début et la fin, ou le début et une durée : l’autre se calcule tout seul.</div>
        <div class="field" style="margin-top:16px"><span class="l">Durée réelle <span style="font-weight:500">(le temps vraiment dormi)</span></span>
          <div class="durpick"><button data-p="dm">−</button><b>${fmtDur(st.d)}</b><button data-p="dp">+</button></div>
          <div class="quick wrapq">${NAP_DUR.map(v => `<button data-p="d" data-v="${v}" class="${st.d === v ? 'on' : ''}">${v === 26 ? '26 min · NASA' : v + ' min'}</button>`).join('')}</div>
          ${!st.t && st.p ? (g => `<div class="napcmp ${g.ok ? 'ok' : g.x > 0 ? 'over' : 'under'}"><span>Prévu <b>${fmtDur(st.p)}</b></span><span>Dormi <b>${fmtDur(st.d)}</b></span><span>${g.ok ? '✓ comme prévu' : (g.x > 0 ? '+' : '−') + ' ' + fmtDur(Math.abs(g.x))}</span></div>`)(napGap(st)) : ''}</div>
        <div class="napverdict">
          <div><i style="background:${lvlColor(c.dur[0])}"></i><b>${c.dur[1]}</b><span>${c.dur[2]}</span></div>
          <div><i style="background:${lvlColor(c.time[0])}"></i><b>${c.time[1]}</b><span>${c.time[2]}</span></div></div>
        <div class="field" style="margin-top:18px"><span class="l">Au réveil, tu étais… <span style="font-weight:500">(facultatif)</span></span>
          <div class="rate" style="grid-template-columns:repeat(3,1fr)">${NAP_FEEL.map(([e, l], i) => `<button data-p="f" data-v="${i + 1}" class="${st.f === i + 1 ? 'on' : ''}"><i>${e}</i>${l}</button>`).join('')}</div></div>
        <button class="qnone ${st.c ? 'on' : ''}" data-p="c" style="text-align:left;padding:12px 14px">☕ Café bu juste avant <span class="dim" style="font-weight:500">— « sieste-café » : la caféine agit au moment du réveil</span></button>
        <button class="btn" data-p="save" style="margin-top:16px">Enregistrer</button>
        ${cur ? '<button class="btn danger" data-p="delete">Effacer cette sieste</button>' : ''}`;
      // Minutes entre deux heures (passage de minuit compris) ; null si hors de 1 min à 5 h
      const gap = (from, to) => { const m = (tMin(to) - tMin(from) + 1440) % 1440; return m >= 1 && m <= 300 ? m : null; };
      // Nouveau début : la fin ne bouge pas si elle reste cohérente, sinon c'est la durée qui est gardée
      $('#ps', el).addEventListener('change', e => {
        if (!e.target.value) return;
        const ns = e.target.value.slice(0, 5), m = gap(ns, tStr(tMin(st.s) + st.d));
        st.s = ns; if (m) st.d = m; draw();
      });
      // Nouvelle fin : la durée est recalculée
      $('#pe', el).addEventListener('change', e => {
        if (!e.target.value) return;
        touched = true;
        const m = gap(st.s, e.target.value.slice(0, 5));
        if (m) st.d = m; else toast('La fin doit être après le début (5 h maximum)');
        draw();
      });
      el.scrollTop = top;
    };
    draw();
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      const a = b.dataset.p, v = +b.dataset.v;
      if (a === 't') { st.t = v; draw(); }
      else if (a === 'dm') { st.d = Math.max(1, st.d - 5); touched = true; draw(); }
      else if (a === 'dp') { st.d = Math.min(300, st.d + 5); touched = true; draw(); }
      else if (a === 'd') { st.d = v; touched = true; draw(); }
      else if (a === 'pv') { if (st.p === v) delete st.p; else { st.p = v; if (!touched) st.d = v; } draw(); }
      else if (a === 'pm') { st.p = Math.max(5, st.p - 5); if (!touched) st.d = st.p; draw(); }
      else if (a === 'pp') { st.p = Math.min(300, st.p + 5); if (!touched) st.d = st.p; draw(); }
      else if (a === 'f') { if (st.f === v) delete st.f; else st.f = v; draw(); }
      else if (a === 'c') { if (st.c) delete st.c; else st.c = 1; draw(); }
      else if (a === 'save') {
        const s0 = $('#ps', el).value.slice(0, 5);
        if (!/^\d{2}:\d{2}$/.test(s0)) { toast('Indique l’heure de début'); return; }
        const e2 = { s: s0, d: st.d, t: st.t ? 1 : 0 };
        if (st.f) e2.f = st.f; if (st.c) e2.c = 1; if (!st.t && st.p) e2.p = st.p;
        const arr = [...list];
        if (cur) arr[idx] = e2; else { if (arr.length >= 6) { toast('6 siestes maximum par jour'); return; } arr.push(e2); }
        arr.sort((x, y) => x.s.localeCompare(y.s));
        S.sleep.naps[k] = arr; save(); closeSheet(); refresh();
        const c = napCheck(e2);
        toast(`Sieste enregistrée · ${fmtDur(e2.d)} · ${c.good ? 'bien placée 👍' : c.bad ? (c.time[0] === 0 ? 'trop tardive' : c.dur[1].toLowerCase()) : c.dur[1].toLowerCase()}`);
      } else if (a === 'delete') {
        const old = [...list]; const arr = list.filter((_, i) => i !== idx);
        if (arr.length) S.sleep.naps[k] = arr; else delete S.sleep.naps[k];
        save(); closeSheet(); refresh();
        toast('Sieste effacée', 'Annuler', () => { S.sleep.naps[k] = old; save(); refresh(); });
      }
    });
  });
}

        <div class="pace" style="margin-top:14px">⏰ Mets une alarme dans <b>${fmtDur(p + 5)}</b> (≈ 5 min pour t’endormir).</div>

function napStop() {
  const on = S.sleep.napOn; if (!on) return;
  const d = Math.min(300, Math.max(1, Math.round((Date.now() - on.at) / 60000)));
  S.sleep.napOn = null; save(); refresh();
  openNap(on.k, undefined, { s: on.s, d, ...(on.p ? { p: on.p } : {}) });
}

// Teneurs : EFSA 2015 (avis sur la sécurité de la caféine) et EUFIC ; pre-workout : dose standard de Gardiner et al. 2023
const CAF = [
  { k: 'esp', e: '☕', n: 'Expresso', s: '60 ml', mg: 80 },
  { k: 'dbl', e: '☕', n: 'Double expresso', s: '2 × 60 ml', mg: 160 },
  { k: 'fil', e: '☕', n: 'Café filtre / allongé', s: '200 ml', mg: 90 },
  { k: 'lait', e: '🥛', n: 'Café au lait', s: 'bol, ≈ 1 café filtre', mg: 90 },
  { k: 'cap', e: '☕', n: 'Cappuccino / crème', s: '≈ 1 expresso', mg: 80 },
  { k: 'deca', e: '☕', n: 'Café décaféiné', s: '200 ml', mg: 4 },
  { k: 'the', e: '🍵', n: 'Thé noir', s: '250 ml', mg: 55 },
  { k: 'vert', e: '🍵', n: 'Thé vert', s: '250 ml', mg: 38 },
  { k: 'cola', e: '🥤', n: 'Cola', s: 'canette', mg: 40 },
  { k: 'ener', e: '⚡', n: 'Boisson énergisante', s: '250 ml', mg: 80 },
  { k: 'enerl', e: '⚡', n: 'Énergisante grande', s: '500 ml', mg: 160 },
  { k: 'pre', e: '💪', n: 'Pre-workout', s: 'dose standard', mg: 217 },
  { k: 'choc', e: '🍫', n: 'Chocolat noir', s: '50 g', mg: 25 },
  { k: 'autre', e: '✏️', n: 'Autre', s: 'mg au choix', mg: 100 }
];
const CAF_Q = [0.5, 1, 1.5, 2, 3];
const ZL = [['😄', 'Pleine forme'], ['🙂', 'En forme'], ['😐', 'Moyen'], ['🥱', 'Fatigué'], ['😵', 'Épuisé']];
const cafOf = d => S.sleep.caf[d] || [];
const cafDef = k => CAF.find(c => c.k === k) || CAF[CAF.length - 1];
const cafName = c => c.k === 'autre' ? (c.l || 'Caféine') : cafDef(c.k).n;
// Heure du coucher qui suit la journée d (minutes depuis minuit de d) : réelle si la nuit est notée, sinon l'objectif
const bedOf = d => { const n = S.sleep.log[addDays(d, 1)]; return bedAxis(n ? n.bed : S.sleep.goals.bed) + 720; };
// Délai minimal avant le coucher (Gardiner et al. 2023) : café ~107 mg → 8,8 h ; pre-workout ~217 mg → 13,2 h ;
// pas de délai trouvé pour une tasse de thé noir (petites doses ≤ 60 mg)
const cafCut = mg => mg <= 60 ? 0 : mg > 150 ? 792 : 528;
const HALF = 300;   // demi-vie moyenne retenue : 5 h (de 2 à 10 h selon les personnes)
function cafCheck(c, d) {
  const gap = bedOf(d) - tMin(c.t), cut = cafCut(c.mg);
  return { gap, cut, late: cut > 0 && gap < cut, left: gap <= 0 ? c.mg : c.mg * Math.pow(0.5, gap / HALF) };
}
function cafDay(d) {
  const list = cafOf(d), ch = list.map(c => cafCheck(c, d));
  const tot = list.reduce((a, c) => a + c.mg, 0);
  return { list, ch, tot, n: list.length, late: ch.filter(x => x.late).length, left: ch.reduce((a, x) => a + x.left, 0),
    last: list.length ? list[list.length - 1].t : null, over: tot > 400, big: list.some(c => c.mg > 200), lim: bedOf(d) - 528 };
}

  if (nW !== null && nO !== null) lines.push(['Note de la nuit suivante', `${fmtNote(nW)}/10 après une sieste`, `${fmtNote(nO)}/10 sans sieste`]);
  const bW = stat(nightsWith, n => bedAxis(n.bed)), bO = stat(nightsWithout, n => bedAxis(n.bed));
  if (bW !== null && bO !== null) lines.push(['Coucher moyen le soir', `${fmtTime(tStr(bW + 720))} après une sieste`, `${fmtTime(tStr(bO + 720))} sans sieste`]);
  const badDays = days.filter(d => napsOf(d).some(n => napCheck(n).bad) && after(d)), goodDays = days.filter(d => napsOf(d).length && !napsOf(d).some(n => napCheck(n).bad) && after(d));
  const bd = stat(badDays, n => nightNote(n)), gd = stat(goodDays, n => nightNote(n));
  if (bd !== null && gd !== null) lines.push(['Nuit suivante selon la sieste', `${fmtNote(gd)}/10 sieste bien faite`, `${fmtNote(bd)}/10 longue ou tardive`]);
  if (lines.length) html += `<div class="subhead" style="margin-top:14px">Tes repères</div>` + lines.map(([t, a, b]) => `<div class="naprow"><b>${t}</b><span>${a}</span><span>${b}</span></div>`).join('');
  else html += `<div class="mute small" style="margin-top:12px">Continue à noter tes siestes (et ton ressenti au réveil) : l’appli comparera tes nuits avec et sans sieste dès qu’il y aura au moins 2 cas de chaque.</div>`;
  // Assoupissements involontaires fréquents sur les 7 derniers jours
  let doz = 0; for (let i = 0; i < 7; i++) doz += napsOf(addDays(k, -i)).filter(n => n.t === 1).length;
  if (doz >= 3) html += `<div class="napwarn">💤 Tu t’es assoupi sans le vouloir ${doz} fois en 7 jours. S’endormir souvent dans la journée peut être un signe de manque de sommeil la nuit.</div>`;
  html += `<div class="subhead" style="margin-top:16px">Minutes de sieste par jour</div>` + napChart(days, k);
  html += `<div class="legend" style="margin-top:8px"><span><i style="background:#818CF8"></i>Bien faite</span><span><i style="background:#FBBF24"></i>À surveiller</span><span><i style="background:#FB923C"></i>Trop longue ou tardive</span></div></div>`;
  return html;
}
function napChart(days, k) {
  const W = 340, H = 120, P = 4, B = 16, T = 10, n = days.length, bw = (W - 2 * P) / n;
  const max = Math.max(60, ...days.map(napMin));
  const y = v => T + (H - T - B) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart"><rect x="${P}" y="${y(30).toFixed(1)}" width="${W - 2 * P}" height="${(y(10) - y(30)).toFixed(1)}" fill="#818CF8" opacity=".08"/>
    <text x="${P + 2}" y="${(y(30) - 3).toFixed(1)}" font-size="9" fill="#5A6070">zone idéale 10–30 min</text>`;
  days.forEach((d, i) => {
    const bx = P + i * bw + bw * 0.16, w = bw * 0.68, naps = napsOf(d);
    s += `<g data-act="sleepDay" data-k="${d}" style="cursor:pointer"><rect x="${(P + i * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent"/>`;
    let base = H - B;
    naps.forEach(nn => {
      const hh = (H - T - B) * nn.d / max;
      s += `<rect x="${bx.toFixed(1)}" y="${(base - hh).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1.5, hh - 1).toFixed(1)}" rx="${Math.min(3, w / 3).toFixed(1)}" fill="${napColor(napCheck(nn))}"/>`;
      base -= hh;
    });
    if (d === k && naps.length) s += `<rect x="${(bx - 1.5).toFixed(1)}" y="${(base - 1.5).toFixed(1)}" width="${(w + 3).toFixed(1)}" height="${(H - B - base + 3).toFixed(1)}" rx="4" fill="none" stroke="#F2F3F5" stroke-width="1.5"/>`;
    if (n <= 14 || i % 5 === 4 || d === k) s += `<text x="${(bx + w / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle" font-size="${n > 14 ? 9 : 10}" fill="${d === k ? '#F2F3F5' : '#5A6070'}" font-weight="700">${n > 14 ? parse(d).getDate() : LETTER[parse(d).getDay()]}</text>`;
    s += `</g>`;
  });
  return s + `</svg>`;
}

          : `<div class="snote half">?<small>/10</small></div><div><b>Note de la nuit</b><span>Réponds aux deux questions pour l’obtenir (facultatif)</span></div>`}</div>
        <div class="subhead" style="margin-top:18px">Plus de détails <span style="font-weight:500">(facultatif)</span></div>

        <div class="field"><span class="l">Réveils pendant la nuit</span>${chips('a', SA)}</div>
        <div class="field"><label class="l" for="nn">Remarque</label><input class="inp" id="nn" maxlength="80" placeholder="Ex. café tard, malade, écran au lit…" value="${esc(st.note || '')}"></div>

        draw(); el.scrollTop = top;

        const bed = $('#nb', el).value.slice(0, 5), wake = $('#nw', el).value.slice(0, 5);

}

/* ---------- Vue : Tâches ---------- */
let showDone = false;
// Matrice d'Eisenhower : 1 = urgent+important, 2 = important, 3 = urgent, 4 = ni l'un ni l'autre
const QUADS = {
  1: { verb: 'Faire', sub: 'Urgent · Important', color: '#FF6B6B' },
  2: { verb: 'Planifier', sub: 'Important · Pas urgent', color: '#C6F432' },
  3: { verb: 'Déléguer', sub: 'Urgent · Pas important', color: '#FBBF24' },
  4: { verb: 'Éliminer', sub: 'Ni urgent ni important', color: '#94A3B8' }
};
const qTag = t => t.q ? `<span class="qtag" style="--qc:${QUADS[t.q].color}">${QUADS[t.q].verb}</span>` : '';
function taskCard(t) {
  if (t.doneAt) {
    const late = t.doneAt > t.due;
    return `<div class="tcard done" data-id="${t.id}">
      <button class="tcheck" data-act="tcheck" data-id="${t.id}" aria-label="Marquer comme non faite">${I.check}</button>

  const barColor = d.cls === 'late' ? 'var(--danger)' : d.cls === 'soon' ? '#FBBF24' : 'var(--accent)';
  return `<div class="tcard ${d.cls === 'late' ? 'late' : ''}" data-id="${t.id}">

    <div class="tbody" data-act="tedit" data-id="${t.id}">
      <div class="tname">${esc(t.title)}</div>

      ${t.note ? `<div class="tnote">${esc(t.note)}</div>` : ''}

}
function vTasks() {

function chipHtml(t) {

function matrixHtml(open) {
  const tray = open.filter(x => !x.q);
  let html = `<div class="hint" style="margin:10px 0 12px">Maintiens une tâche, puis fais-la glisser dans une case</div>`;

    <div class="zbody">${tray.length ? tray.map(chipHtml).join('') : '<div class="zempty">Les nouvelles tâches arrivent ici</div>'}</div></div>`;
  html += `<div class="axes"><span>Urgent</span><span>Pas urgent</span></div><div class="matrix">`;

    html += `<div class="zone quad" data-q="${q}" style="--qc:${Q.color}">
      <div class="zhead"><div><b>${Q.verb}</b><small>${Q.sub}</small></div><span>${items.length}</span></div>
      <div class="zbody">${items.length ? items.map(chipHtml).join('') : '<div class="zempty">Glisse ici</div>'}</div></div>`;

function listHtml(open) {
  let html = '';
  const t = todayKey(), tom = addDays(t, 1), eow = endOfWeek(t), eom = endOfMonth(t);
  const groups = [
    ['En retard', x => x.due < t], ['Aujourd’hui', x => x.due === t], ['Demain', x => x.due === tom],
    ['Cette semaine', x => x.due > tom && x.due <= eow], ['Ce mois-ci', x => x.due > eow && x.due > tom && x.due <= eom],
    ['Plus tard', x => x.due > eom && x.due > eow && x.due > tom]
  ];
  if (!open.length) html += `<div class="summary"><div style="font-size:30px">🎉</div><div><b>Tout est fait</b><div class="mute">Aucune tâche en attente.</div></div></div>`;
  groups.forEach(([label, fn]) => {
    const items = open.filter(fn);
    if (items.length) html += `<div class="section">${label}</div><div class="list">${items.map(taskCard).join('')}</div>`;
  });
  return html;
}

/* ---------- Glisser-déposer des tâches dans la matrice ---------- */
let tdrag = null, tdragEnded = false;
function startTaskDrag(st) {
  st.active = true; tdrag = st;
  const r = st.chip.getBoundingClientRect();
  st.offX = st.x - r.left; st.offY = st.y - r.top;
  const g = st.chip.cloneNode(true);
  g.classList.add('ghost'); g.style.width = r.width + 'px';
  document.body.appendChild(g); st.ghost = g;
  st.chip.classList.add('lifted');
  document.body.classList.add('task-dragging');
  moveTaskDrag(st);
  const loop = () => {
    if (!st.active) return;
    const edgeTop = 90, edgeBot = innerHeight - 150;
    if (st.y < edgeTop) window.scrollBy(0, -Math.ceil((edgeTop - st.y) / 5));
    else if (st.y > edgeBot) window.scrollBy(0, Math.ceil((st.y - edgeBot) / 5));
    hoverZone(st);
    st.raf = requestAnimationFrame(loop);
  };
  st.raf = requestAnimationFrame(loop);
}
function hoverZone(st) {
  const el = document.elementFromPoint(st.x, st.y);
  const z = el && el.closest('.zone');
  if (z !== st.over) {
    if (st.over) st.over.classList.remove('over');
    if (z) z.classList.add('over');
    st.over = z;
  }
}
function moveTaskDrag(st) {
  st.ghost.style.transform = `translate(${st.x - st.offX}px, ${st.y - st.offY}px) rotate(-2deg) scale(1.05)`;
  hoverZone(st);
}
function endTaskDrag(st, drop) {
  st.active = false; tdrag = null;
  cancelAnimationFrame(st.raf);
  if (st.ghost) st.ghost.remove();
  st.chip.classList.remove('lifted');
  document.body.classList.remove('task-dragging');
  if (st.over) st.over.classList.remove('over');
  tdragEnded = true; setTimeout(() => { tdragEnded = false; }, 350);
  if (drop && st.over) {
    const q = +st.over.dataset.q || null, t = taskById(st.id);
    if (t && (t.q || null) !== q) {
      t.q = q; save();
      toast(q ? `Classée dans « ${QUADS[q].verb} »` : 'Remise dans « À classer »');
    }
  }
  refresh();
}
document.addEventListener('touchmove', e => { if (tdrag) e.preventDefault(); }, { passive: false });
function toggleTask(t) {
  const dropNext = () => {
    if (!t.nextId) return;
    const i = S.tasks.findIndex(x => x.id === t.nextId && !x.doneAt);
    if (i >= 0) S.tasks.splice(i, 1);
    delete t.nextId;
  };
  if (t.doneAt) { t.doneAt = null; dropNext(); save(); refresh(); return; }
  t.doneAt = todayKey();
  let msg = 'Tâche terminée ✓';
  if (t.repeat) {
    // Tâche répétée : la suivante est créée avec la prochaine échéance
    const due = nextDue(t), today = todayKey();
    const nt = { id: uid(), title: t.title, due, note: t.note || '', q: t.q || null, created: t.due > today ? t.due : today, doneAt: null, repeat: { ...t.repeat } };
    S.tasks.push(nt); t.nextId = nt.id;
    msg = `Faite ✓ · prochaine le ${fmtDue(due)}`;
  }
  save(); refresh();
  toast(msg, 'Annuler', () => { t.doneAt = null; dropNext(); save(); refresh(); });
}
function deleteTask(id) {
  const i = S.tasks.findIndex(x => x.id === id); if (i < 0) return;
  const [t] = S.tasks.splice(i, 1);
  save(); refresh();
  toast(`« ${t.title} » supprimée`, 'Annuler', () => { S.tasks.splice(Math.min(i, S.tasks.length), 0, t); save(); refresh(); });
}
function openTask(t) {
  const isNew = !t;
  const f = t ? { title: t.title, due: t.due, note: t.note || '', q: t.q || null, repeat: t.repeat ? { ...t.repeat } : null } : { title: '', due: addDays(todayKey(), 7), note: '', q: null, repeat: null };

  const body = () => {
    const opts = dueOptions();

      <label class="l" for="tDate" style="margin-top:14px">Ou une date précise</label>
      <input class="inp${custom ? ' picked' : ''}" id="tDate" type="date" value="${f.due}"></div>
    <div class="field"><span class="l">Répéter</span>
      <div class="momchips" style="flex-wrap:wrap">${REP.map(([v, l]) => `<button data-t="rep" data-v="${v}" class="${repKind() === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${repKind() === 'custom' ? `<div class="repcustom"><span>Tous les</span><input class="inp" id="tEvery" inputmode="numeric" maxlength="3" value="${f.repeat.every}">
        <div class="seg">${[['day', 'jours'], ['week', 'semaines'], ['month', 'mois'], ['year', 'ans']].map(([u, l]) => `<button data-t="repUnit" data-v="${u}" class="${f.repeat.unit === u ? 'on' : ''}">${l}</button>`).join('')}</div></div>` : ''}
      ${f.repeat ? `<div class="mute small" style="margin-top:8px">Quand tu la coches, la suivante est créée automatiquement pour le <b style="color:var(--text)">${fmtDue(advanceDue(f.due, { ...f.repeat, anchor: parse(f.due).getDate() }))}</b></div>` : ''}</div>
    <div class="field"><span class="l">Case de la matrice</span>
      <div class="qpick">${[1, 2, 3, 4].map(q => `<button data-t="q" data-v="${q}" style="--qc:${QUADS[q].color}" class="${f.q === q ? 'on' : ''}"><b>${QUADS[q].verb}</b><small>${QUADS[q].sub}</small></button>`).join('')}</div>
      <button class="qnone ${f.q ? '' : 'on'}" data-t="q" data-v="0">À classer plus tard</button></div>
    <div class="field"><label class="l" for="tNote">Note (facultatif)</label>
      <input class="inp" id="tNote" maxlength="140" placeholder="Ex : vaisselle + plan de travail" value="${esc(f.note)}"></div>
    <button class="btn" data-t="save">${isNew ? 'Ajouter la tâche' : 'Enregistrer'}</button>
    ${isNew ? '' : `<button class="btn danger" data-t="delete">Supprimer la tâche</button>`}`;
  };
  openSheet('', el => {
    const read = () => {
      f.title = $('#tTitle', el).value; f.note = $('#tNote', el).value;
      const ev = $('#tEvery', el); if (ev && f.repeat) { const n = parseInt(ev.value, 10); if (n >= 1 && n <= 365) f.repeat.every = n; }
    };
    const draw = () => {
      const st = el.scrollTop; el.innerHTML = body(); el.scrollTop = st;
      $('#tDate', el).addEventListener('change', e => { read(); if (e.target.value) { f.due = e.target.value; f.pick = null; draw(); } });
    };
    draw();
    if (isNew) setTimeout(() => { try { $('#tTitle', el).focus(); } catch (e) {} }, 320);
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      read();

      if (k === 'due') { f.due = b.dataset.v; f.pick = b.dataset.o; draw(); }
      else if (k === 'q') { f.q = +b.dataset.v || null; draw(); }
      else if (k === 'rep') {
        const v = b.dataset.v;
        f.repeat = v === 'none' ? null : v === 'custom' ? { every: f.repeat ? f.repeat.every : 2, unit: f.repeat ? f.repeat.unit : 'week', custom: true } : { every: 1, unit: v };

      else if (k === 'save') {
        const title = f.title.trim();
        if (!title) { const i = $('#tTitle', el); i.classList.add('shake'); i.focus(); setTimeout(() => i.classList.remove('shake'), 600); toast('Donne un nom à ta tâche'); return; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(f.due)) { toast('Choisis une échéance'); return; }
        const repeat = f.repeat ? cleanRepeat({ every: f.repeat.every, unit: f.repeat.unit, anchor: parse(f.due).getDate() }) : null;
        if (isNew) S.tasks.push({ id: uid(), title, due: f.due, note: f.note.trim(), q: f.q, created: todayKey(), doneAt: null, repeat });
        else Object.assign(t, { title, due: f.due, note: f.note.trim(), q: f.q, repeat, created: t.created > f.due ? f.due : t.created });
        save(); closeSheet(); refresh();
        toast(isNew ? 'Tâche ajoutée' : 'Modifications enregistrées');
      }
      else if (k === 'delete') { closeSheet(); deleteTask(t.id); }
    });
  });
}

      <div class="handle" aria-label="Déplacer">${I.grip}</div>

      <div class="hbody" data-act="edit" data-id="${h.id}"><div class="hname">${esc(h.name)}</div><div class="hmeta">${daysLabel(h.days)}${h.type === 'value' ? ` · valeur${h.unit ? ' en ' + esc(h.unit) : ''}` : h.type === 'goal' ? ` · objectif ${esc(fmtQty(h.goal, h.unit))}` : ''}</div></div>

function bindDrag() {
  const list = $('#mlist'); if (!list) return;
  list.querySelectorAll('.handle').forEach(handle => {
    handle.addEventListener('pointerdown', e => {
      e.preventDefault();
      const row = handle.closest('.mrow');
      row.classList.add('dragging');
      const pid = e.pointerId;
      const move = ev => {
        if (ev.pointerId !== pid) return;
        const y = ev.clientY;
        const rows = [...list.querySelectorAll('.mrow:not(.dragging)')];
        let before = null;
        for (const r of rows) { const b = r.getBoundingClientRect(); if (y < b.top + b.height / 2) { before = r; break; } }
        if (before) { if (row.nextSibling !== before) list.insertBefore(row, before); }
        else if (list.lastElementChild !== row) list.appendChild(row);
        list.querySelectorAll('.mrow .rank').forEach((el, i) => el.textContent = i + 1);
      };
      const up = ev => {
        if (ev.pointerId !== pid) return;
        row.classList.remove('dragging');
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        const ids = [...list.querySelectorAll('.mrow')].map(r => r.dataset.id);
        S.habits.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
        save(); refresh();
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    });
  });
}

              : Object.assign({ name: '', icon: '✅', color: COLORS[S.habits.length % COLORS.length], days: [...ALL], type: 'check', unit: '', note: '', goal: '', portions: [] }, preset ? JSON.parse(JSON.stringify(preset)) : {});

    <div class="field"><label class="l" for="fName">Nom</label>

    <div class="field"><span class="l">Icône</span>
      <div class="emojis">${EMOJIS.map(e => `<button data-f="icon" data-v="${e}" class="${f.icon === e ? 'on' : ''}">${e}</button>`).join('')}</div>
      <div class="emoji-custom"><input class="inp" id="fEmoji" maxlength="4" placeholder="Ou tape ton propre emoji" value="${EMOJIS.includes(f.icon) ? '' : esc(f.icon)}"></div></div>

    <div class="field"><span class="l">Couleur</span>

      <div class="quick">
        <button data-f="preset" data-v="all" class="${sameSet(f.days, ALL) ? 'on' : ''}">Tous les jours</button>
        <button data-f="preset" data-v="week" class="${sameSet(f.days, WEEKDAYS) ? 'on' : ''}">En semaine</button>
        <button data-f="preset" data-v="weekend" class="${sameSet(f.days, WEEKEND) ? 'on' : ''}">Week-end</button></div></div>

    <div class="field"><span class="l">Type de suivi</span>
      <div class="seg"><button data-f="type" data-v="check" class="${f.type === 'check' ? 'on' : ''}">Cocher</button>

      ${f.type === 'goal' ? `
