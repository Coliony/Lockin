<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Lock In</title>
<style>
:root{
  --bg:#0E0F12;--card:#17191F;--card2:#21242C;--line:#2A2E38;--text:#F2F3F5;--mute:#8B90A0;--dim:#4A4F5C;
  --accent:#C6F432;--danger:#FF6B6B;--r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:disabled{cursor:default}
input,textarea{font:inherit;color:inherit}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
.mute{color:var(--mute)}
.small{font-size:13px}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(170px + env(safe-area-inset-bottom))}

/* En-tête */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:10px 0 18px}
.eyebrow{color:var(--mute);font-size:14px;font-weight:600}
h1{font-size:32px;font-weight:800;letter-spacing:-.025em;margin:2px 0 0;line-height:1.1}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--text)}

/* Résumé du jour */
.summary{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:var(--r);padding:16px}
.summary b{display:block;font-size:18px;font-weight:750}
.summary .mute{font-size:14px;margin-top:2px}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.daynav button.arrow{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.daynav button.arrow:disabled{opacity:.25}
.daynav .lbl{font-weight:700;font-size:15px;text-align:center}
.daynav .lbl button{display:block;margin:2px auto 0;color:var(--accent);font-size:13px;font-weight:600}

/* Cartes habitudes */
.list{display:flex;flex-direction:column;gap:10px}
.hcard{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:13px 14px;transition:transform .12s,opacity .2s;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.hcard:active{transform:scale(.98)}
.hicon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 18%,transparent);flex:none}
.hbody{min-width:0;flex:1}
.hname{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmeta{color:var(--mute);font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{width:34px;height:34px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;transition:background .2s,border-color .2s}
.check svg{width:18px;height:18px;stroke:#0E0F12;opacity:0;transition:opacity .15s}
.hcard.done .check{background:var(--c);border-color:var(--c)}
.hcard.done .check svg{opacity:1}
.hcard.done .hname{color:var(--mute);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--mute) 60%,transparent)}
.hcard.done .hicon{filter:saturate(.6)}
.hint{text-align:center;color:var(--dim);font-size:12px;margin-top:16px}

/* Bandeau installation */
.banner{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--accent) 12%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner .go{margin-left:auto;background:var(--accent);color:#0E0F12;font-weight:700;padding:8px 12px;border-radius:10px;flex:none}
.banner .x{color:var(--mute);padding:4px;flex:none}

/* Vide */
.empty{text-align:center;padding:40px 10px 10px}
.empty .big{font-size:46px}
.empty p{color:var(--mute);margin:8px 0 22px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--card);border:1px solid var(--line);padding:9px 13px;border-radius:999px;font-size:14px;font-weight:600}

/* Suivi */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{background:var(--card);border-radius:16px;padding:14px 12px}
.tile b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em}
.tile span{color:var(--mute);font-size:12px;line-height:1.3;display:block;margin-top:2px}
.section{font-size:13px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:24px 2px 10px}
.srow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r);padding:12px 14px;width:100%;text-align:left}
.srow .hicon{width:40px;height:40px;font-size:19px;border-radius:12px}
.dots{display:flex;gap:4px;flex:none}
.dot{width:12px;height:12px;border-radius:4px;background:#262A33}
.dot.done{background:var(--c)}
.dot.missed{background:color-mix(in srgb,var(--danger) 50%,#262A33)}
.dot.off,.dot.future{background:transparent;box-shadow:inset 0 0 0 1px #2E323C}
.dot.pending{background:#262A33;box-shadow:inset 0 0 0 1.5px var(--mute)}

/* Gestion */
.mrow{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:10px 10px 10px 4px;transition:box-shadow .15s,transform .15s}
.mrow.dragging{box-shadow:0 0 0 2px var(--accent),0 12px 30px rgba(0,0,0,.5);transform:scale(1.02);position:relative;z-index:2}
.handle{width:34px;height:44px;display:grid;place-items:center;touch-action:none;color:var(--dim);flex:none;cursor:grab}
.handle svg{width:18px;height:18px;fill:currentColor}
.mrow .hicon{width:40px;height:40px;font-size:19px;border-radius:12px}
.mrow .hbody{cursor:pointer}
.rank{font-size:12px;color:var(--dim);font-weight:700;width:16px;text-align:center;flex:none}
.act{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.act svg{width:18px;height:18px;stroke:var(--mute)}
.act.del svg{stroke:var(--danger)}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,15,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-around}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--mute);padding:6px 8px;border-radius:12px;flex:1}
.nav button svg{width:24px;height:24px;stroke:currentColor}
.nav button.on{color:var(--accent)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(80px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;background:var(--accent);color:#0E0F12;display:grid;place-items:center;box-shadow:0 10px 30px rgba(198,244,50,.22);z-index:21}
.fab svg{width:26px;height:26px;stroke:#0E0F12}

/* Feuilles (bottom sheets) */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow-y:auto;background:#131519;border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sheet.full{top:0;max-height:none;border-radius:0;padding-top:calc(env(safe-area-inset-top) + 12px);background:var(--bg)}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 16px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}

/* Formulaire */
.field{margin-bottom:20px}
.l{display:block;font-size:13px;color:var(--mute);margin-bottom:8px;font-weight:650}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--accent)}
.preview{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:var(--r);padding:13px 14px;margin-bottom:20px}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis button{aspect-ratio:1;border-radius:12px;background:var(--card);font-size:20px}
.emojis button.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--card2)}
.emoji-custom{display:flex;gap:8px;align-items:center;margin-top:8px}
.emoji-custom .inp{padding:10px 12px;font-size:15px}
.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:4px}
.colors button{aspect-ratio:1;border-radius:50%;background:var(--c)}
.colors button.on{box-shadow:0 0 0 3px #131519,0 0 0 5px var(--c)}
.days{display:flex;gap:6px}
.days button{flex:1;height:44px;border-radius:12px;background:var(--card);font-weight:750;color:var(--mute)}
.days button.on{background:var(--accent);color:#0E0F12}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{font-size:13px;font-weight:600;color:var(--mute);background:var(--card);padding:7px 11px;border-radius:999px}
.quick button.on{color:var(--text);box-shadow:inset 0 0 0 1px var(--mute)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px}
.seg button{flex:1;padding:11px 8px;border-radius:10px;color:var(--mute);font-weight:650;font-size:14px}
.seg button.on{background:var(--card2);color:var(--text)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--accent);color:#0E0F12;font-weight:750;font-size:16px;text-align:center;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--text)}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 40%,transparent)}
.valrow{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.valrow .inp{font-size:28px;font-weight:800;text-align:center;padding:16px}
.valrow .unit{font-size:20px;font-weight:700;color:var(--mute);flex:none;min-width:20px}

/* Détail & calendrier */
.dhead{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
.dhead .hicon{width:56px;height:56px;font-size:28px;border-radius:18px}
.dhead h2{margin:0}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px}
.monthnav b{font-size:17px;font-weight:750}
.monthnav button{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center}
.monthnav button:disabled{opacity:.25}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:12px;color:var(--mute);text-align:center;padding-bottom:2px;font-weight:700}
.cell{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:650;background:var(--card);color:var(--text)}
.cell.done{background:var(--c);color:#0E0F12}
.cell.missed{background:color-mix(in srgb,var(--danger) 16%,var(--card));color:var(--danger)}
.cell.off,.cell.future{background:transparent;color:var(--dim)}
.cell.today{box-shadow:inset 0 0 0 2px var(--text)}
.cell.empty{visibility:hidden}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.monthline{margin-top:10px;font-size:14px;color:var(--mute)}
.note{background:var(--card);border-radius:14px;padding:12px 14px;color:var(--mute);font-size:14px;margin-top:4px;line-height:1.4}
.spark{width:100%;height:auto;display:block;background:var(--card);border-radius:16px;margin-top:10px}
.vlist{margin-top:10px;background:var(--card);border-radius:16px;overflow:hidden}
.vlist div{display:flex;justify-content:space-between;padding:11px 14px;font-size:14px;border-top:1px solid var(--line)}
.vlist div:first-child{border-top:0}
.setrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:14px;margin-top:8px;font-weight:600}
.setrow svg{width:20px;height:20px;stroke:var(--mute);flex:none}
.setrow.red{color:var(--danger)}
.setrow.red svg{stroke:var(--danger)}

/* Tâches */
.tcard{display:flex;align-items:flex-start;gap:12px;background:var(--card);border-radius:var(--r);padding:14px}
.tcard.late{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 35%,transparent)}
.tcheck{width:28px;height:28px;border-radius:9px;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;margin-top:1px;transition:background .2s,border-color .2s}
.tcheck svg{width:16px;height:16px;stroke:#0E0F12;opacity:0}
.tcard.done .tcheck{background:var(--accent);border-color:var(--accent)}
.tcard.done .tcheck svg{opacity:1}
.tbody{flex:1;min-width:0;cursor:pointer}
.tname{font-weight:650;font-size:16px;line-height:1.3;word-break:break-word}
.tcard.done .tname{color:var(--mute);text-decoration:line-through}
.tmeta{font-size:13px;color:var(--mute);margin-top:4px}
.tnote{font-size:13px;color:var(--dim);margin-top:3px}
.due{font-weight:700;color:var(--text)}
.due.ok{color:var(--accent)}
.due.soon{color:#FBBF24}
.due.late{color:var(--danger)}
.tbar{height:4px;border-radius:2px;background:#262A33;margin-top:10px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:2px}
.section.toggle{display:flex;justify-content:space-between;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:24px 0 10px;padding:0 2px}
.subhead{font-size:14px;color:var(--mute);font-weight:650;margin:16px 2px 10px}
.tiles.four{grid-template-columns:1fr 1fr}
.link{display:block;margin:12px auto 0;color:var(--accent);font-weight:650;font-size:14px}
.dues{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dues button{background:var(--card);border-radius:12px;padding:11px 12px;text-align:left;font-weight:650;font-size:14px}
.dues button small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
.dues button.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--card2)}
input[type=date].inp{color-scheme:dark;min-height:50px}
.inp.picked{border-color:var(--accent)}

/* Alimentation */
.sec-row{display:flex;justify-content:space-between;align-items:center}
.sec-row button{font:inherit;font-size:12px;letter-spacing:.04em;color:var(--accent);font-weight:800;text-transform:uppercase}
.ncard{background:var(--card);border-radius:var(--r);padding:16px}
.nk{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nk b{font-size:30px;font-weight:800;letter-spacing:-.02em}
.nk span{color:var(--mute);font-weight:650}
.nrest{font-size:14px;font-weight:700;color:var(--accent);flex:none}
.nrest.over{color:#FB923C}
.nbar{height:10px;border-radius:5px;background:#262A33;margin-top:10px;overflow:hidden}
.nbar i{display:block;height:100%;border-radius:5px;background:var(--accent);transition:width .35s}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.mac span{display:block;font-size:12px;color:var(--mute);font-weight:650}
.mac b{display:block;font-size:17px;font-weight:800;margin-top:2px;white-space:nowrap}
.mac b small{font-size:11.5px;color:var(--mute);font-weight:600}
.mbar{height:6px;border-radius:3px;background:#262A33;margin-top:6px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--mc);border-radius:3px}
.meal{background:var(--card);border-radius:var(--r);margin-top:10px;overflow:hidden}
.mhead{display:flex;justify-content:space-between;padding:12px 14px 6px;font-size:13px;font-weight:750;color:var(--mute)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-top:1px solid #20232B}
.frow:first-of-type{border-top:0}
.frow > div{min-width:0}
.fname{font-weight:650;font-size:15px;line-height:1.3;word-break:break-word}
.frow small,.fpick small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;line-height:1.35}
.frow b{font-size:15px;flex:none}
.chart{width:100%;height:auto;display:block}
.wtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wtop b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--c)}
.wtop small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.wtop .gadd{padding:12px 16px}
.wstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.wstats div{background:var(--card2);border-radius:12px;padding:10px}
.wstats b{display:block;font-size:15px;font-weight:800}
.wstats span{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.small-seg{margin-bottom:8px}
.small-seg button{padding:8px;font-size:13px}
.goalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.momchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.momchips::-webkit-scrollbar{display:none}
.momchips button{flex:none;font-size:13px;font-weight:650;color:var(--mute);background:var(--card);padding:8px 12px;border-radius:999px}
.momchips button.on{color:#0E0F12;background:var(--accent)}
.searchbar{margin:12px 0 4px;position:sticky;top:-12px;background:var(--bg);padding:6px 0;z-index:2}
.fsec{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 2px 8px}
.fitem{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:14px;margin-bottom:6px}
.fpick{flex:1;min-width:0;text-align:left;padding:11px 12px}
.fpick b{color:var(--text)}
.fempty{color:var(--mute);font-size:14px;padding:12px 4px;line-height:1.45}
.dim{color:var(--dim)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.inp.big{font-size:24px;font-weight:800}
.punit{align-self:center;font-weight:700;color:var(--mute);flex:none;min-width:30px}
.ptot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px}
.ptot div{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:inset 0 -3px 0 var(--mc,var(--accent))}
.ptot b{display:block;font-size:18px;font-weight:800}
.ptot span{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.keep{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;font-weight:600;color:var(--mute)}
.keep input{width:20px;height:20px;accent-color:var(--accent)}

/* Habitudes « objectif » */
.hprog{height:4px;border-radius:2px;background:#262A33;margin-top:7px;overflow:hidden;max-width:220px}
.hprog i{display:block;height:100%;background:var(--c);border-radius:2px;transition:width .3s}
.goalrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.portions{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px;align-items:center}
.prow .pl{flex:1.4;min-width:0;padding:12px}
.prow .pa{flex:1;min-width:0;padding:12px}
.gbig{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.gbig b{font-size:40px;font-weight:800;letter-spacing:-.02em;color:var(--c)}
.gbig span{font-size:18px;color:var(--mute);font-weight:700}
.gbar{height:10px;border-radius:5px;background:#262A33;margin-top:10px;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .35s}

.zone.tray .zbody{flex-direction:row;flex-wrap:wrap}

.tchip-body{min-width:0;flex:1}

body.task-dragging .zone{box-shadow:inset 0 0 0 1.5px #3A3F4B}

.toast button{color:#4D7C0F;font-weight:800}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

<body>

<button class="fab" id="fab" aria-label="Nouvelle habitude"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* ---------- Utilitaires ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return keyOf(d); };
const todayKey = () => keyOf(new Date());
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmtDay = k => cap(parse(k).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
const fmtShort = k => parse(k).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtNum = v => Number(v).toLocaleString('fr-FR', { maximumFractionDigits: 2 }).replace(/\u202f/g, '\u00a0');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const COLORS = ['#C6F432','#4ADE80','#2DD4BF','#38BDF8','#818CF8','#A78BFA','#F472B6','#FB7185','#F87171','#FB923C','#FBBF24','#94A3B8'];
const EMOJIS = ['✅','⚖️','💧','🏋️','🏃','🚶','🚴','🏊','🧘','📚','📖','✍️','📝','🧠','💻','🎯',
                '💊','🛏️','🌅','🌙','🥗','🍎','🥤','☕','🚭','🍷','📵','🦷','🚿','🧴','🧹','💰',
                '🎣','🎸','🎧','🗣️','🙏','❤️','🐶','☀️'];
const MOMENTS = [['breakfast', 'Petit-déj', '🌅'], ['morning', 'Matinée', '☕'], ['lunch', 'Midi', '🍽️'], ['afternoon', 'Après-midi', '🍎'], ['dinner', 'Soir', '🌙']];
const MOMENT_IDS = MOMENTS.map(m => m[0]);
const WEEK = [1, 2, 3, 4, 5, 6, 0];
const LETTER = {1:'L',2:'M',3:'M',4:'J',5:'V',6:'S',0:'D'};
const SHORTDAY = {1:'lun',2:'mar',3:'mer',4:'jeu',5:'ven',6:'sam',0:'dim'};
const ALL = [0,1,2,3,4,5,6], WEEKDAYS = [1,2,3,4,5], WEEKEND = [6,0];
const sameSet = (a, b) => a.length === b.length && b.every(x => a.includes(x));

const I = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
  left: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
  grip: '<svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>',
  today: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="M8 14h2M14 14h2M8 17.5h2"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>',
  food: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2 1.5-3 4-3 7v3h3"/></svg>',
  tasks: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12l3 3 5-6"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
  up: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>'
};

/* ---------- Données ---------- */
const KEY = 'lockin.v1';
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      if (d && Array.isArray(d.habits)) {
        if (!Array.isArray(d.tasks)) d.tasks = [];
        d.tasks.forEach(t => { if (![1, 2, 3, 4].includes(t.q)) t.q = null; });
        d.diet = sanitizeDiet(d.diet);
        return d;
      }
    }
  } catch (e) {}
  return { v: 1, habits: [], tasks: [], diet: sanitizeDiet(null) };
}
// Données de diète : reconstruites proprement (sert au chargement et aux imports)
function sanitizeDiet(d) {
  const num = (v, def = 0) => (typeof v === 'number' && isFinite(v) && v >= 0 ? v : def);
  const str = (v, max = 120) => (typeof v === 'string' ? v.slice(0, max) : '');
  const isKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k);
  const okId = v => (typeof v === 'string' && /^[a-z0-9]{1,40}$/i.test(v) ? v : uid());
  const nut = n => ({ kcal: num(n && n.kcal), p: num(n && n.p), c: num(n && n.c), f: num(n && n.f) });
  const moment = m => (MOMENT_IDS.includes(m) ? m : 'lunch');
  const out = { goals: { kcal: 2500, p: 150, c: 300, f: 80 }, goalsSet: false, foods: [], log: {}, weightHabit: null, wRange: '90', kRange: 14 };
  if (!d || typeof d !== 'object') return out;
  if (d.goals) out.goals = { kcal: num(d.goals.kcal, 2500), p: num(d.goals.p, 150), c: num(d.goals.c, 300), f: num(d.goals.f, 80) };
  out.goalsSet = !!d.goalsSet;
  if (Array.isArray(d.foods)) out.foods = d.foods.filter(x => x && str(x.name).trim()).map(x => ({
    id: okId(x.id), name: str(x.name), unit: str(x.unit, 15) || 'g', base: num(x.base, 100) || 100, n: nut(x.n),
    src: ['mine', 'ciqual', 'off'].includes(x.src) ? x.src : 'mine', brand: str(x.brand, 80),
    serving: x.serving && num(x.serving.qty) > 0 ? { qty: num(x.serving.qty), label: str(x.serving.label, 40) } : null,
    moment: x.moment ? moment(x.moment) : null, used: num(x.used)
  }));
  if (d.log && typeof d.log === 'object') Object.keys(d.log).filter(isKey).forEach(k => {
    if (!Array.isArray(d.log[k])) return;
    const list = d.log[k].filter(e => e && str(e.name).trim()).map(e => ({
      id: okId(e.id), name: str(e.name), qty: num(e.qty, 1), unit: str(e.unit, 15) || 'portion', base: num(e.base, 1) || 1,
      n: nut(e.n), moment: moment(e.moment), foodId: typeof e.foodId === 'string' ? okId(e.foodId) : null
    }));
    if (list.length) out.log[k] = list;
  });
  if (typeof d.weightHabit === 'string') out.weightHabit = d.weightHabit;
  if (['30', '90', 'all'].includes(d.wRange)) out.wRange = d.wRange;
  if ([7, 14, 30].includes(d.kRange)) out.kRange = d.kRange;
  return out;
}
let S = load();
let persistAsked = false;
// Stockage : Chrome accorde environ 5 Mo par site au localStorage.
const STORE_LIMIT = 5 * 1024 * 1024;
let storeState = 'ok', storeSize = 0, storeNearWarned = false;
try { storeSize = (localStorage.getItem(KEY) || '').length; storeState = storeSize > STORE_LIMIT * 0.8 ? 'near' : 'ok'; } catch (e) {}
function save() {
  const json = JSON.stringify(S);
  const before = storeState;
  storeSize = json.length;
  try { localStorage.setItem(KEY, json); storeState = storeSize > STORE_LIMIT * 0.8 ? 'near' : 'ok'; }
  catch (e) { storeState = 'full'; }
  if (storeState === 'full') setTimeout(storeAlert, 0);
  else if (storeState === 'near' && !storeNearWarned) { storeNearWarned = true; setTimeout(storeAlert, 0); }
  if (before !== storeState) setTimeout(renderMain, 0);
  if (!persistAsked && navigator.storage && navigator.storage.persist) {
    persistAsked = true; navigator.storage.persist().catch(() => {});
  }
}
const storePct = () => Math.min(100, Math.round(storeSize / STORE_LIMIT * 100));
function storeAlert() {
  if (storeState === 'full') toast('⚠️ Stockage plein : ta dernière modification n’a pas été enregistrée', 'Exporter', exportData, true);
  else if (storeState === 'near') toast(`⚠️ Stockage presque plein (${storePct()} %)`, 'Exporter', exportData, true);
}
function storeBanner() {
  if (storeState === 'ok') return '';
  const full = storeState === 'full';
  return `<div class="storewarn ${full ? 'full' : ''}"><div><b>${full ? 'Stockage plein' : `Stockage presque plein · ${storePct()} %`}</b>
    <span>${full ? 'Tes dernières modifications ne sont pas enregistrées. Exporte une sauvegarde, puis libère de la place (Réglages).' : 'Exporte une sauvegarde pour ne rien perdre. Je pourrai passer l’appli sur un stockage plus grand.'}</span></div>
    <button data-act="export">Exporter</button></div>`;
}
const byId = id => S.habits.find(h => h.id === id);
const taskById = id => S.tasks.find(t => t.id === id);

/* ---------- Logique tâches ---------- */
const utc = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const daysBetween = (a, b) => Math.round((utc(b) - utc(a)) / 86400000);
const endOfWeek = k => addDays(k, (7 - parse(k).getDay()) % 7);           // dimanche
const endOfMonth = k => { const d = parse(k); return keyOf(new Date(d.getFullYear(), d.getMonth() + 1, 0)); };
const inOneMonth = k => {

  if (diff < 0) { rel = `En retard de ${-diff} j`; cls = 'late'; }
  else if (diff === 0) { rel = 'Aujourd’hui'; cls = 'soon'; }
  else if (diff === 1) { rel = 'Demain'; cls = 'soon'; }

/* ---------- Logique habitudes ---------- */
const sched = (h, k) => k >= h.start && h.days.includes(parse(k).getDay());
const isDone = (h, k) => {
  const v = h.history[k];
  if (v === undefined) return false;
  return h.type === 'goal' ? v >= h.goal - 1e-9 : true;
};
// Quantités (habitudes « objectif ») : gestion L ↔ ml
const isLitre = u => /^(l|litres?)$/i.test(String(u || '').trim());
const roundQ = v => Math.round(v * 1000) / 1000;
function fmtQty(v, unit) {
  if (isLitre(unit) && v !== 0 && Math.abs(v) < 1) return `${fmtNum(Math.round(v * 1000))} ml`;
  return `${fmtNum(v)}${unit ? ' ' + unit : ''}`;
}
// « 500 ml », « 50 cl », « 0,5 », « 500 » (→ ml si l'unité est le litre) …
function parseQty(s, unit) {
  const m = String(s || '').trim().toLowerCase().replace(',', '.').match(/^(\d*\.?\d+)\s*(ml|cl|l)?$/);
  if (!m) return NaN;
  let v = parseFloat(m[1]);
  if (isLitre(unit)) {
    if (m[2] === 'ml') v /= 1000;
    else if (m[2] === 'cl') v /= 100;
    else if (!m[2] && v >= 20) v /= 1000;
  }
  return roundQ(v);
}
const goalTotal = (h, k) => h.history[k] || 0;

function status(h, k) {
  const t = todayKey();
  if (k > t) return 'future';
  if (isDone(h, k)) return 'done';
  if (!sched(h, k)) return 'off';
  if (k === t) return 'pending';
  return 'missed';
}
// Série en cours : jours prévus consécutifs faits (aujourd'hui non fait ne casse pas la série)
function streak(h) {
  let k = todayKey(), n = 0;
  if (sched(h, k) && !isDone(h, k)) k = addDays(k, -1);
  for (let i = 0; i < 5000 && k >= h.start; i++) {
    if (sched(h, k)) { if (isDone(h, k)) n++; else break; }
    k = addDays(k, -1);
  }
  return n;
}
function bestStreak(h) {
  const t = todayKey(); let k = h.start, run = 0, best = 0;
  for (let i = 0; i < 5000 && k <= t; i++) {
    if (sched(h, k)) {
      if (isDone(h, k)) { run++; if (run > best) best = run; }
      else if (k !== t) run = 0;
    }
    k = addDays(k, 1);
  }
  return best;
}
// Taux de réussite sur N jours (aujourd'hui compté seulement s'il est fait)
function rateCounts(h, days) {
  const t = todayKey(); let k = t, planned = 0, done = 0;
  for (let i = 0; i < days && k >= h.start; i++) {
    if (sched(h, k)) {
      if (isDone(h, k)) { planned++; done++; }
      else if (k !== t) planned++;
    }
    k = addDays(k, -1);
  }
  return [done, planned];
}
const rate = (h, days = 30) => { const [d, p] = rateCounts(h, days); return p ? Math.round(d / p * 100) : null; };
const valueEntries = h => Object.entries(h.history).filter(([, v]) => typeof v === 'number').sort((a, b) => a[0] < b[0] ? -1 : 1);
const lastValue = h => { const e = valueEntries(h); return e.length ? e[e.length - 1][1] : null; };

function daysLabel(days) {
  if (sameSet(days, ALL)) return 'Tous les jours';
  if (sameSet(days, WEEKDAYS)) return 'En semaine';
  if (sameSet(days, WEEKEND)) return 'Le week-end';
  return WEEK.filter(d => days.includes(d)).map(d => SHORTDAY[d]).join(' · ');
}

function setValue(h, k, val) {
  if (val === null || val === undefined) delete h.history[k];
  else { h.history[k] = val; if (k < h.start) h.start = k; }
  save(); refresh();
}
function tapHabit(h, k) {
  if (k > todayKey()) return;
  if (h.type === 'value') { openValue(h, k); return; }
  if (h.type === 'goal') { openGoal(h, k); return; }
  const was = isDone(h, k);
  setValue(h, k, was ? null : 1);
  if (!was) { celebrate(k); }
}
function celebrate(k) {
  if (k !== todayKey()) return;
  const list = S.habits.filter(h => sched(h, k));
  if (list.length && list.every(h => isDone(h, k))) toast('Journée validée 🔒 Bien joué.');
}

let toastTimer = null;
let toastSticky = 0;
function toast(msg, actionLabel, action, sticky) {
  if (!sticky && toastSticky > Date.now()) return;
  toastSticky = sticky ? Date.now() + 6000 : 0;
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button>${esc(actionLabel)}</button>` : ''}`;
  if (actionLabel) t.querySelector('button').onclick = () => { t.classList.remove('show'); action(); };
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), actionLabel ? 6000 : 2600);
}

/* ---------- Feuilles (avec bouton retour Android) ---------- */
const sheets = [];
let useHistory = true;
try { history.replaceState({ sheet: 0 }, ''); } catch (e) { useHistory = false; }

function openSheet(html, mount, full) {
  const w = document.createElement('div');
  w.className = 'sheet-wrap';
  w.innerHTML = `<div class="backdrop"></div><div class="sheet${full ? ' full' : ''}">${html}</div>`;
  document.body.appendChild(w);
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open')));
  w.querySelector('.backdrop').onclick = () => closeSheet();
  sheets.push(w);
  if (useHistory) { try { history.pushState({ sheet: sheets.length }, ''); } catch (e) { useHistory = false; } }
  if (mount) mount(w.querySelector('.sheet'), w);
  return w;
}
function removeWrap(w) {
  w.classList.remove('open');
  if (w._onClose) w._onClose();
  setTimeout(() => w.remove(), 280);
}
function closeSheet(n = 1) {
  n = Math.min(n, sheets.length);
  if (!n) return;
  if (useHistory) history.go(-n);
  else for (let i = 0; i < n; i++) removeWrap(sheets.pop());
}
window.addEventListener('popstate', e => {
  const target = (e.state && e.state.sheet) || 0;
  while (sheets.length > target) removeWrap(sheets.pop());
});

function confirmBox(title, msg, okLabel) {
  // Résout true (la feuille reste ouverte : l'appelant la ferme) ou false (fermée ici)
  return new Promise(res => {
    let answered = false;
    const w = openSheet(`<div class="grab"></div><h2>${esc(title)}</h2><p class="mute" style="line-height:1.45">${esc(msg)}</p>
      <button class="btn danger" data-c="ok">${esc(okLabel)}</button><button class="btn ghost" data-c="no">Annuler</button>`,
      el => el.addEventListener('click', e => {
        const b = e.target.closest('[data-c]'); if (!b || answered) return;
        answered = true;
        if (b.dataset.c === 'ok') res(true); else { closeSheet(); res(false); }
      }));
    w._onClose = () => { if (!answered) { answered = true; res(false); } };
  });
}

// Calories sur 7 / 14 / 30 jours : barres + ligne d'objectif ; toucher une barre ouvre le jour
function kcalSection(k) {
  const range = +(S.diet.kRange || 14);
  const days = []; for (let i = range - 1; i >= 0; i--) days.push(addDays(k, -i));
  const vals = days.map(d => dayTot(d).kcal);
  const goal = S.diet.goals.kcal;
  let html = `<div class="section sec-row"><span>Calories</span><span class="mute small" style="text-transform:none;letter-spacing:0;font-weight:600">touche une barre pour voir le jour</span></div>
    <div class="ncard"><div class="seg small-seg">${[[7, '7 j'], [14, '14 j'], [30, '30 j']].map(([v, l]) => `<button data-act="kRange" data-v="${v}" class="${range === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const filled = vals.filter(v => v > 0);
  if (!filled.length) return html + `<div class="mute small" style="text-align:center;padding:16px 0 6px">Aucun repas noté sur cette période.</div></div>`;
  const W = 340, H = 150, P = 4, B = 16, top = 12;

  svg += `<rect x="${P}" y="${y(goal * 1.1).toFixed(1)}" width="${W - 2 * P}" height="${(y(goal * 0.9) - y(goal * 1.1)).toFixed(1)}" fill="#C6F432" opacity=".06"/>`;
  svg += `<line x1="${P}" x2="${W - P}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}" stroke="#8B90A0" stroke-dasharray="4 4" stroke-width="1"/>`;
  days.forEach((d, i) => {
    const v = vals[i], x = P + i * bw + bw * 0.16, w = bw * 0.68, hh = v > 0 ? Math.max(3, (H - top - B) * v / max) : 0;
    const cls = kcalClass(v, goal), col = cls === 'high' ? '#FB923C' : cls === 'low' ? '#5E7F1A' : '#C6F432';
    svg += `<g data-act="dietDay" data-k="${d}" style="cursor:pointer"><rect x="${(P + i * bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent"/>`;
    if (v > 0) svg += `<rect x="${x.toFixed(1)}" y="${(H - B - hh).toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="${Math.min(3, w / 3).toFixed(1)}" fill="${col}"/>`;
    if (d === k && v > 0) svg += `<rect x="${(x - 1.5).toFixed(1)}" y="${(H - B - hh - 1.5).toFixed(1)}" width="${(w + 3).toFixed(1)}" height="${(hh + 3).toFixed(1)}" rx="4" fill="none" stroke="#F2F3F5" stroke-width="1.5"/>`;
    if (range <= 14 || i % 5 === 4 || d === k) svg += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle" font-size="${range > 14 ? 9 : 10}" fill="${d === k ? '#F2F3F5' : '#5A6070'}" font-weight="700">${range > 14 ? parse(d).getDate() : LETTER[parse(d).getDay()]}</text>`;
    svg += `</g>`;
  });
  svg += `<text x="${W - P}" y="${(y(goal) - 4).toFixed(1)}" text-anchor="end" font-size="10" fill="#8B90A0">objectif ${fmtNum(goal)}</text></svg>`;
  const avg = r0(filled.reduce((a, b) => a + b, 0) / filled.length);
  const inGoal = filled.filter(v => kcalClass(v, goal) === 'ok').length;
  const avgM = MACROS.map(([key]) => { const xs = days.map(d => dayTot(d)[key]).filter((_, i) => vals[i] > 0); return r0(xs.reduce((a, b) => a + b, 0) / xs.length); });
  html += svg + `<div class="legend" style="margin-top:6px"><span><i style="background:#5E7F1A"></i>Moins de 80 %</span><span><i style="background:#C6F432"></i>Dans l’objectif (±10 %)</span><span><i style="background:#FB923C"></i>Au-dessus</span></div>

  return html;
}

    <div class="deltas">${deltas.map(([l, v]) => `<div><b class="${v === null ? '' : v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v === null ? '–' : sign(v) + ' kg'}</b><span>${l}</span></div>`).join('')}</div>

      : `<div class="mute small" style="text-align:center;padding:18px 0 6px">${shown.length ? 'Une seule pesée sur cette période : la courbe apparaîtra dès la deuxième.' : 'Aucune pesée sur cette période.'}</div>`}

// Variation d'une semaine à l'autre (moyenne de chaque semaine, lundi → dimanche)
function weeklyHtml(vals, color) {
  const weeks = new Map();
  vals.forEach(([k, v]) => { const mon = addDays(k, -((parse(k).getDay() + 6) % 7)); const w = weeks.get(mon) || []; w.push(v); weeks.set(mon, w); });
  const list = [...weeks.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([mon, xs]) => [mon, xs.reduce((a, b) => a + b) / xs.length]);
  if (list.length < 2) return '';
  const diffs = list.slice(1).map((w, i) => [w[0], r1(w[1] - list[i][1]), r1(w[1])]).slice(-8);
  const W = 340, H = 140, T = 16, B = 30, P = 6;
  const m = Math.max(0.3, ...diffs.map(d => Math.abs(d[1])));
  const mid = T + (H - T - B) / 2, sc = (H - T - B) / 2 / m, bw = (W - 2 * P) / diffs.length;
  let svg = `<svg viewBox="0 0 ${W} ${H}" class="chart"><line x1="${P}" x2="${W - P}" y1="${mid}" y2="${mid}" stroke="#3A3F4B" stroke-width="1"/>`;
  diffs.forEach(([mon, d], i) => {
    const x = P + i * bw + bw * 0.2, w = bw * 0.6, hh = Math.max(2, Math.abs(d) * sc), yy = d >= 0 ? mid - hh : mid;
    svg += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="${d >= 0 ? color : '#F472B6'}"/>
      <text x="${(x + w / 2).toFixed(1)}" y="${(d >= 0 ? yy - 4 : yy + hh + 11).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" fill="#F2F3F5">${d > 0 ? '+' : ''}${fmtNum(d)}</text>
      <text x="${(x + w / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="9.5" fill="#8B90A0">${parse(mon).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</text>`;
  });
  svg += `</svg>`;
  return `<div class="subhead">Variation d’une semaine à l’autre <span class="mute small">(moyenne de la semaine, en kg)</span></div><div class="ncard" style="padding:10px">${svg}
    <div class="mute small" style="padding:0 6px 4px">Chaque barre compare la moyenne d’une semaine (date du lundi) à celle de la semaine précédente.</div></div>`;
}
function weightChart(vals, color) {
  const W = 340, H = 170, L = 36, R = 8, T = 12, B = 22;
  const xs = vals.map(v => utc(v[0])), ys = vals.map(v => v[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max(0.5, (y1 - y0) * 0.15), lo = y0 - pad, hi = y1 + pad;
  const X = x => L + (W - L - R) * (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0));
  const Y = y => T + (H - T - B) * (1 - (y - lo) / (hi - lo));
  const pts = vals.map(v => [X(utc(v[0])), Y(v[1])]);
  // Moyenne glissante sur 7 jours (pesées des 7 derniers jours à chaque date)
  const avg = vals.map(([k]) => { const w = vals.filter(v => v[0] <= k && v[0] > addDays(k, -7)).map(v => v[1]); return [X(utc(k)), Y(w.reduce((a, b) => a + b) / w.length)]; });
  let s = `<svg viewBox="0 0 ${W} ${H}" class="chart">`;
  [hi, (hi + lo) / 2, lo].forEach(v => {
    s += `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="#262A33" stroke-width="1"/>
      <text x="${L - 6}" y="${(Y(v) + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#8B90A0">${fmtNum(r1(v))}</text>`;
  });
  const area = `M${pts[0][0].toFixed(1)},${(H - B).toFixed(1)} ` + pts.map(p => `L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ') + ` L${pts[pts.length - 1][0].toFixed(1)},${(H - B).toFixed(1)} Z`;
  s += `<path d="${area}" fill="${color}" opacity=".10"/>`;
  s += `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".85" points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`;
  if (pts.length <= 90) s += pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.8" fill="${color}"/>`).join('');
  if (vals.length >= 3) s += `<polyline fill="none" stroke="#F2F3F5" stroke-width="2.2" stroke-dasharray="1 0" stroke-linejoin="round" stroke-linecap="round" opacity=".9" points="${avg.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>`;
  const dl = k => parse(k).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  s += `<text x="${L}" y="${H - 5}" font-size="10" fill="#8B90A0">${dl(vals[0][0])}</text>
    <text x="${W - R}" y="${H - 5}" text-anchor="end" font-size="10" fill="#8B90A0">${dl(vals[vals.length - 1][0])}</text></svg>`;
  return s;
}

/* ---------- Bases d'aliments ---------- */
const norm = s => String(s || '').toLowerCase().replace(/œ/g, 'oe').replace(/æ/g, 'ae').normalize('NFD').replace(/[̀-ͯ]/g, '');
let CIQ = null, ciqPromise = null;
function loadCiqual() {
  if (!ciqPromise) ciqPromise = fetch('ciqual.json').then(r => { if (!r.ok) throw new Error('ciqual'); return r.json(); }).then(d => {
    CIQ = d.foods.map(x => ({ name: x[0], group: d.groups[x[1]], unit: 'g', base: 100, n: { kcal: x[2], p: x[3], c: x[4], f: x[5] }, src: 'ciqual', key: norm(x[0]) }));
    return CIQ;
  }).catch(e => { ciqPromise = null; throw e; });
  return ciqPromise;
}
// Recherche locale : tous les mots doivent apparaître ; priorité au début du nom puis aux noms courts
function searchList(list, q, max) {
  const words = norm(q).split(/[\s,'’-]+/).filter(w => w.length > 0);
  if (!words.length) return [];
  const res = [];
  for (const it of list) {
    const key = it.key || norm(it.name);
    if (!words.every(w => key.includes(w))) continue;
    let score = key.startsWith(words[0]) ? 0 : new RegExp('(^|[^a-z])' + words[0].replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(key) ? 1 : 2;
    res.push([score, key.length, it]);
  }
  return res.sort((a, b) => a[0] - b[0] || a[1] - b[1]).slice(0, max).map(r => r[2]);
}

// Open Food Facts (en ligne). Limite : 10 recherches / minute → pas de recherche à chaque lettre.
const offCache = new Map();
function fetchT(url, ms) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  return fetch(url, { signal: ctl.signal }).finally(() => clearTimeout(t));
}
const pickTxt = v => (v && typeof v === 'object' ? (v.fr || v.main || Object.values(v)[0] || '') : (v || ''));
const numOr = v => { const n = typeof v === 'string' ? parseFloat(v.replace(',', '.')) : v; return typeof n === 'number' && isFinite(n) ? n : null; };
function mapOff(p) {
  if (!p) return null;
  const name = String(pickTxt(p.product_name_fr) || pickTxt(p.product_name) || pickTxt(p.generic_name_fr) || '').trim();
  if (!name) return null;
  const nu = p.nutriments || {};
  let kcal = numOr(nu['energy-kcal_100g']);
  if (kcal === null && numOr(nu.energy_100g) !== null) kcal = numOr(nu.energy_100g) / 4.184;
  if (kcal === null) return null;
  const brands = Array.isArray(p.brands) ? p.brands.join(', ') : String(p.brands || '');
  const liquid = /\b\d*\s*(ml|cl|l)\b/i.test(String(p.quantity || '')) && !/\b\d*\s*(g|kg)\b/i.test(String(p.quantity || ''));
  const sq = numOr(p.serving_quantity);
  return {
    name: name.slice(0, 120), brand: brands.split(',')[0].trim().slice(0, 60), unit: liquid ? 'ml' : 'g', base: 100, src: 'off', ref: String(p.code || ''),
    n: { kcal: r1(kcal), p: r1(numOr(nu.proteins_100g) || 0), c: r1(numOr(nu.carbohydrates_100g) || 0), f: r1(numOr(nu.fat_100g) || 0) },
    serving: sq > 0 && sq < 5000 ? { qty: r1(sq), label: String(p.serving_size || '').slice(0, 40) } : null
  };
}
async function offSearch(q) {
  const key = norm(q).trim();
  if (offCache.has(key)) return offCache.get(key);
  if (navigator.onLine === false) { const e = new Error('offline'); e.code = 'offline'; throw e; }
  const fields = 'code,product_name,product_name_fr,generic_name_fr,brands,nutriments,serving_size,serving_quantity,quantity';
  const url1 = `https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=30&sort_by=unique_scans_n&lc=fr&tagtype_0=countries&tag_contains_0=contains&tag_0=france&fields=${fields}`;
  const url2 = `https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&langs=fr&page_size=30`;
  let items = null, rate = false;
  try {
    const r = await fetchT(url1, 12000);
    if (r.status === 429 || r.status === 503) rate = true;
    else if (r.ok) { const j = await r.json(); items = (j.products || []).map(mapOff).filter(Boolean); }
  } catch (e) { /* on tente le second service */ }
  if (items === null) {
    try {
      const r = await fetchT(url2, 12000);
      if (r.ok) { const j = await r.json(); items = (j.hits || j.products || []).map(mapOff).filter(Boolean); }
      else if (r.status === 429 || r.status === 503) rate = true;
    } catch (e) { /* rien */ }
  }
  if (items === null) { const e = new Error('off'); e.code = rate ? 'rate' : (navigator.onLine === false ? 'offline' : 'error'); throw e; }
  offCache.set(key, items);
  return items;
}

/* ---------- Feuille « Ajouter un aliment » ---------- */
function openFoodSearch(k) {
  const st = { q: '', moment: defaultMoment(), off: { q: '', status: 'idle', items: [] }, ciq: 'idle', timer: null };
  const results = {};    // index → aliment, pour les clics
  openSheet('', (el, w) => {
    el.innerHTML = `<div class="shead"><button class="iconbtn" data-s="close" aria-label="Fermer">${I.close}</button>
        <h2 style="margin:0">Ajouter un aliment</h2><span style="width:42px"></span></div>
      <div class="mute small" style="margin:-8px 0 10px">${fmtDay(k)}</div>
      <div class="momchips" id="moms"></div>
      <div class="searchbar"><input class="inp" id="fq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Rechercher : riz, poulet, yaourt…"></div>
      <div id="fres"></div>`;
    const drawMoms = () => { $('#moms', el).innerHTML = MOMENTS.map(([id, l, ic]) => `<button data-s="moment" data-v="${id}" class="${st.moment === id ? 'on' : ''}">${ic} ${l}</button>`).join(''); };
    const row = (f, idx, canEdit) => {
      results[idx] = f;
      const sub = f.src === 'ciqual' ? f.group : f.src === 'off' ? (f.brand || 'Produit du commerce') : (f.brand ? 'Mes aliments · ' + f.brand : 'Mes aliments');
      return `<div class="fitem"><button class="fpick" data-s="pick" data-i="${idx}"><div class="fname">${esc(f.name)}</div>
        <small>${esc(sub)} · <b>${fmtNum(r0(f.n.kcal))} kcal</b> · P ${fmtG(f.n.p)} · G ${fmtG(f.n.c)} · L ${fmtG(f.n.f)} <span class="dim">/ ${esc(per(f))}</span></small></button>
        ${canEdit ? `<button class="act" data-s="editFood" data-i="${idx}" aria-label="Modifier">${I.edit}</button>` : ''}</div>`;
    };
    const draw = () => {
      for (const key in results) delete results[key];
      let html = '', i = 0;
      const q = st.q.trim();
      const mine = q ? searchList(S.diet.foods, q, 30) : [...S.diet.foods].sort((a, b) => (b.used || 0) - (a.used || 0) || a.name.localeCompare(b.name)).slice(0, 40);
      if (mine.length) html += `<div class="fsec">${q ? 'Mes aliments' : 'Mes aliments · récents'}</div>` + mine.map(f => row(f, i++, true)).join('');
      if (q.length >= 2) {
        if (CIQ) {
          const c = searchList(CIQ, q, 60), shown = st.more ? c : c.slice(0, 8);
          html += `<div class="fsec">Aliments de base · Ciqual</div>` + (c.length ? shown.map(f => row(f, i++, false)).join('') : `<div class="fempty">Aucun aliment de base pour « ${esc(q)} »</div>`);
          if (c.length > shown.length) html += `<button class="link" data-s="more" style="margin:4px auto 0">Afficher plus (${c.length - shown.length})</button>`;
        } else html += `<div class="fsec">Aliments de base · Ciqual</div><div class="fempty">${st.ciq === 'error' ? 'Base Ciqual indisponible' : 'Chargement…'}</div>`;
      }
      if (q.length >= 3) {
        html += `<div class="fsec">Produits du commerce · Open Food Facts</div>`;
        const o = st.off;
        if (o.q !== norm(q).trim() || o.status === 'idle') html += `<div class="fempty">Recherche en ligne dans un instant…</div>`;
        else if (o.status === 'loading') html += `<div class="fempty"><span class="spin"></span> Recherche en ligne…</div>`;
        else if (o.status === 'offline') html += `<div class="fempty">Pas de connexion internet. Les aliments de base restent disponibles.</div>`;
        else if (o.status === 'rate') html += `<div class="fempty">Trop de recherches en peu de temps. Réessaie dans une minute.<br><button class="link" data-s="retry">Réessayer</button></div>`;
        else if (o.status === 'error') html += `<div class="fempty">Open Food Facts ne répond pas.<br><button class="link" data-s="retry">Réessayer</button></div>`;
        else html += o.items.length ? o.items.map(f => row(f, i++, false)).join('') : `<div class="fempty">Aucun produit trouvé pour « ${esc(q)} »</div>`;
      }
      if (!q && !mine.length) html += `<div class="fempty" style="padding-top:26px">Tape le nom d’un aliment. La recherche couvre tes aliments, la table Ciqual (aliments de base) et Open Food Facts (produits du commerce, avec connexion).</div>`;
      html += `<button class="qnone" data-s="newFood" style="margin-top:16px">+ Créer un aliment à la main</button>
        <div class="dim small" style="text-align:center;margin-top:12px">Données : Ciqual (Anses, 2025) et Open Food Facts (ODbL)</div>`;
      $('#fres', el).innerHTML = html;
    };
    const runOff = async () => {
      const q = st.q.trim(); const key = norm(q).trim();
      if (q.length < 3) return;
      st.off = { q: key, status: 'loading', items: [] }; draw();
      try { const items = await offSearch(q); if (st.off.q === key) { st.off = { q: key, status: 'ok', items }; draw(); } }
      catch (e) { if (st.off.q === key) { st.off = { q: key, status: e.code || 'error', items: [] }; draw(); } }
    };
    const inp = $('#fq', el);
    inp.addEventListener('input', () => {
      st.q = inp.value; st.more = false; draw();
      clearTimeout(st.timer);
      if (st.q.trim().length >= 2 && !CIQ) loadCiqual().then(draw).catch(() => { st.ciq = 'error'; draw(); });
      if (st.q.trim().length >= 3) st.timer = setTimeout(runOff, 900);
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(st.timer); runOff(); inp.blur(); } });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      const a = b.dataset.s;
      if (a === 'close') closeSheet();
      else if (a === 'moment') { st.moment = b.dataset.v; drawMoms(); }
      else if (a === 'pick') openPortion(results[+b.dataset.i], { date: k, moment: st.moment, fromSearch: true });
      else if (a === 'editFood') openFoodForm(results[+b.dataset.i], name => { st.q = name; inp.value = name; draw(); });
      else if (a === 'newFood') openFoodForm(null, name => { st.q = name; inp.value = name; draw(); });
      else if (a === 'retry') { offCache.delete(norm(st.q).trim()); runOff(); }
      else if (a === 'more') { st.more = true; draw(); }
    });
    w._refresh = draw;
    w._onClose = () => clearTimeout(st.timer);
    loadCiqual().then(() => { if (st.q) draw(); }).catch(() => { st.ciq = 'error'; });
    drawMoms(); draw();
    setTimeout(() => { try { inp.focus(); } catch (e) {} }, 320);
  }, true);
}

/* ---------- Portion d'un aliment (ajout ou modification d'une entrée) ---------- */
function openPortion(food, ctx) {
  const entry = ctx.entry || null;

  const chips = unitIsMass ? [50, 100, 150, 200, 250] : [0.5, 1, 2, 3, 4];
  openSheet('', el => {
    const draw = () => {
      const tot = { kcal: food.n.kcal * st.qty / food.base, p: food.n.p * st.qty / food.base, c: food.n.c * st.qty / food.base, f: food.n.f * st.qty / food.base };

          · pour ${esc(per(food))} : ${fmtNum(r0(food.n.kcal))} kcal · P ${fmtG(food.n.p)} · G ${fmtG(food.n.c)} · L ${fmtG(food.n.f)}</div>

        <div class="quick" style="flex-wrap:wrap">${food.serving ? `<button data-p="qty" data-v="${food.serving.qty}" class="${st.qty === food.serving.qty ? 'on' : ''}">1 portion${food.serving.label ? ' (' + esc(food.serving.label) + ')' : ''}</button>` : ''}
          ${chips.map(c => `<button data-p="qty" data-v="${c}" class="${st.qty === c ? 'on' : ''}">${fmtNum(c)}${unitIsMass ? ' ' + esc(food.unit) : ''}</button>`).join('')}</div>
        <span class="l" style="margin-top:16px">Moment</span>
        <div class="momchips">${MOMENTS.map(([id, l, ic]) => `<button data-p="moment" data-v="${id}" class="${st.moment === id ? 'on' : ''}">${ic} ${l}</button>`).join('')}</div>
        <div class="ptot"><div><b id="pk">${fmtNum(r0(tot.kcal))}</b><span>kcal</span></div>
          ${MACROS.map(([key, l, col]) => `<div style="--mc:${col}"><b id="p${key}">${fmtG(tot[key])}</b><span>${l} (g)</span></div>`).join('')}</div>
        ${!entry && food.src !== 'mine' ? `<label class="keep"><input type="checkbox" id="pkeep" ${st.keep ? 'checked' : ''}> Garder dans mes aliments</label>` : ''}
        <button class="btn" data-p="save">${entry ? 'Enregistrer' : 'Ajouter'}</button>
        ${entry ? '<button class="btn danger" data-p="delete">Retirer du journal</button>' : ''}`;
      const q = $('#pq', el);
      q.addEventListener('input', () => {
        const v = parseFloat(q.value.replace(',', '.'));
        if (!(v >= 0)) return;
        st.qty = v;
        const t2 = { kcal: food.n.kcal * v / food.base, p: food.n.p * v / food.base, c: food.n.c * v / food.base, f: food.n.f * v / food.base };
        $('#pk', el).textContent = fmtNum(r0(t2.kcal)); MACROS.forEach(([key]) => { $('#p' + key, el).textContent = fmtG(t2[key]); });
        el.querySelectorAll('[data-p="qty"]').forEach(b => b.classList.toggle('on', +b.dataset.v === v));
      });
      q.addEventListener('keydown', e => { if (e.key === 'Enter') $('[data-p="save"]', el).click(); });
    };
    draw();
    el.addEventListener('change', e => { if (e.target.id === 'pkeep') st.keep = e.target.checked; });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      const a = b.dataset.p;
      if (a === 'qty') { st.qty = +b.dataset.v; draw(); }
      else if (a === 'moment') { st.moment = b.dataset.v; draw(); }
      else if (a === 'delete') {
        const list = S.diet.log[ctx.date] || [], i = list.indexOf(entry);
        if (i >= 0) list.splice(i, 1);
        if (!list.length) delete S.diet.log[ctx.date];
        save(); closeSheet(); refresh();
        toast(`« ${entry.name} » retiré`, 'Annuler', () => { (S.diet.log[ctx.date] = S.diet.log[ctx.date] || []).splice(Math.max(0, i), 0, entry); save(); refresh(); });
      }
      else if (a === 'save') {

        let foodId = food.src === 'mine' ? food.id : null;
        if (food.src === 'mine') food.used = Date.now();
        else if (st.keep) {
          const same = S.diet.foods.find(x => norm(x.name) === norm(food.name));
          if (same) { same.used = Date.now(); foodId = same.id; }
          else { const nf = { id: uid(), name: food.name, unit: food.unit, base: food.base, n: { ...food.n }, src: 'mine', brand: food.src === 'ciqual' ? 'Ciqual' : (food.brand || 'Open Food Facts'), serving: food.serving || null, moment: null, used: Date.now() }; S.diet.foods.push(nf); foodId = nf.id; }
        }
        const e2 = { id: uid(), name: food.name, qty: st.qty, unit: food.unit, base: food.base, n: { ...food.n }, moment: st.moment, foodId };
        (S.diet.log[ctx.date] = S.diet.log[ctx.date] || []).push(e2);
        save(); closeSheet(ctx.fromSearch ? 2 : 1); refresh();
        toast(`Ajouté · ${fmtNum(r0(entryTot(e2).kcal))} kcal`, 'Annuler', () => { const l = S.diet.log[ctx.date] || []; const j = l.indexOf(e2); if (j >= 0) l.splice(j, 1); if (!l.length) delete S.diet.log[ctx.date]; save(); refresh(); });
      }
    });
  });
}

/* ---------- Import du suivi de diète (fichier « lockin-diet ») : fusion ---------- */
function importDiet(data) {
  const clean = sanitizeDiet({ goals: data.goals, goalsSet: true, foods: (data.foods || []).map(f => ({ ...f, src: 'mine' })), log: data.log });
  const weights = data.weights && typeof data.weights === 'object' ? Object.entries(data.weights).filter(([k, v]) => /^\d{4}-\d{2}-\d{2}$/.test(k) && typeof v === 'number' && v > 0 && v < 500) : [];
  S.diet.goals = clean.goals; S.diet.goalsSet = true;
  let nf = 0, ne = 0;
  clean.foods.forEach(f => { if (!S.diet.foods.some(x => norm(x.name) === norm(f.name))) { S.diet.foods.push(f); nf++; } });
  Object.entries(clean.log).forEach(([k, list]) => {
    const cur = S.diet.log[k] = S.diet.log[k] || [];
    const sig = e => `${norm(e.name)}|${e.qty}|${r1(e.n.kcal)}|${e.moment}`;
    const seen = new Set(cur.map(sig));
    list.forEach(e => { if (!seen.has(sig(e))) { cur.push(e); ne++; } });
  });
  let h = weightHabit();
  if (weights.length && !h) { createWeightHabit(); h = weightHabit(); }
  weights.forEach(([k, v]) => { if (h.history[k] === undefined) h.history[k] = v; if (k < h.start) h.start = k; });
  save(); refresh();
  return { nf, ne, nw: weights.length };
}

/* ---------- Vue : Suivi ---------- */
function vStats() {
  let html = `<div class="top"><div><div class="eyebrow">Tes progrès</div><h1>Suivi</h1></div>
    <button class="iconbtn" data-act="settings" aria-label="Réglages">${I.gear}</button></div>`;
  if (!S.habits.length) return html + emptyState();
  const t = todayKey();
  const todayList = S.habits.filter(h => sched(h, t));
  const todayDone = todayList.filter(h => isDone(h, t)).length;
  let d7 = 0, p7 = 0; S.habits.forEach(h => { const [d, p] = rateCounts(h, 7); d7 += d; p7 += p; });
  const bestNow = Math.max(0, ...S.habits.map(streak));
  html += `<div class="tiles">
    <div class="tile"><b>${todayDone}/${todayList.length}</b><span>aujourd’hui</span></div>
    <div class="tile"><b>${p7 ? Math.round(d7 / p7 * 100) + ' %' : '–'}</b><span>sur 7 jours</span></div>
    <div class="tile"><b>🔥 ${bestNow}</b><span>meilleure série en cours</span></div></div>`;
  html += `<div class="section">Par habitude · 7 derniers jours</div><div class="list">`;
  html += S.habits.map(h => {
    let dots = '';
    for (let i = 6; i >= 0; i--) { const k = addDays(t, -i); dots += `<span class="dot ${status(h, k)}"></span>`; }
    const r = rate(h);
    return `<button class="srow" style="--c:${h.color}" data-act="detail" data-id="${h.id}">
      <div class="hicon">${esc(h.icon)}</div>
      <div class="hbody"><div class="hname">${esc(h.name)}</div><div class="hmeta">🔥 ${streak(h)} j · ${r === null ? '–' : r + ' %'} sur 30 j</div></div>
      <div class="dots">${dots}</div></button>`;
  }).join('');
  return html + `</div>`;
}

/* ---------- Vue : Tâches ---------- */
let showDone = false;
// Matrice d'Eisenhower : 1 = urgent+important, 2 = important, 3 = urgent, 4 = ni l'un ni l'autre
const QUADS = {
  1: { verb: 'Faire', sub: 'Urgent · Important', color: '#FF6B6B' },
  2: { verb: 'Planifier', sub: 'Important · Pas urgent', color: '#C6F432' },
  3: { verb: 'Déléguer', sub: 'Urgent · Pas important', color: '#FBBF24' },

};
const qTag = t => t.q ? `<span class="qtag" style="--qc:${QUADS[t.q].color}">${QUADS[t.q].verb}</span>` : '';
function taskCard(t) {
  if (t.doneAt) {
    const late = t.doneAt > t.due;
    return `<div class="tcard done" data-id="${t.id}">
      <button class="tcheck" data-act="tcheck" data-id="${t.id}" aria-label="Marquer comme non faite">${I.check}</button>

      <div class="tmeta">Faite le ${fmtDue(t.doneAt)} · <span class="due ${late ? 'late' : 'ok'}">${late ? 'en retard' : 'à temps'}</span></div></div></div>`;
  }
  const d = dueInfo(t);
  const barColor = d.cls === 'late' ? 'var(--danger)' : d.cls === 'soon' ? '#FBBF24' : 'var(--accent)';
  return `<div class="tcard ${d.cls === 'late' ? 'late' : ''}" data-id="${t.id}">
    <button class="tcheck" data-act="tcheck" data-id="${t.id}" aria-label="Marquer comme faite">${I.check}</button>
    <div class="tbody" data-act="tedit" data-id="${t.id}">

function chipHtml(t) {

function matrixHtml(open) {

function listHtml(open) {
  let html = '';
  const t = todayKey(), tom = addDays(t, 1), eow = endOfWeek(t), eom = endOfMonth(t);

    ['En retard', x => x.due < t], ['Aujourd’hui', x => x.due === t], ['Demain', x => x.due === tom],
    ['Cette semaine', x => x.due > tom && x.due <= eow], ['Ce mois-ci', x => x.due > eow && x.due > tom && x.due <= eom],
    ['Plus tard', x => x.due > eom && x.due > eow && x.due > tom]

  });

}

/* ---------- Glisser-déposer des tâches dans la matrice ---------- */
let tdrag = null, tdragEnded = false;
function startTaskDrag(st) {
  st.active = true; tdrag = st;
  const r = st.chip.getBoundingClientRect();
  st.offX = st.x - r.left; st.offY = st.y - r.top;
  const g = st.chip.cloneNode(true);
  g.classList.add('ghost'); g.style.width = r.width + 'px';
  document.body.appendChild(g); st.ghost = g;
  st.chip.classList.add('lifted');
  document.body.classList.add('task-dragging');
  moveTaskDrag(st);
  const loop = () => {
    if (!st.active) return;
    const edgeTop = 90, edgeBot = innerHeight - 150;
    if (st.y < edgeTop) window.scrollBy(0, -Math.ceil((edgeTop - st.y) / 5));
    else if (st.y > edgeBot) window.scrollBy(0, Math.ceil((st.y - edgeBot) / 5));
    hoverZone(st);
    st.raf = requestAnimationFrame(loop);
  };
  st.raf = requestAnimationFrame(loop);
}
function hoverZone(st) {
  const el = document.elementFromPoint(st.x, st.y);
  const z = el && el.closest('.zone');
  if (z !== st.over) {
    if (st.over) st.over.classList.remove('over');
    if (z) z.classList.add('over');
    st.over = z;
  }
}
function moveTaskDrag(st) {
  st.ghost.style.transform = `translate(${st.x - st.offX}px, ${st.y - st.offY}px) rotate(-2deg) scale(1.05)`;
  hoverZone(st);
}
function endTaskDrag(st, drop) {
  st.active = false; tdrag = null;
  cancelAnimationFrame(st.raf);
  if (st.ghost) st.ghost.remove();
  st.chip.classList.remove('lifted');
  document.body.classList.remove('task-dragging');
  if (st.over) st.over.classList.remove('over');
  tdragEnded = true; setTimeout(() => { tdragEnded = false; }, 350);
  if (drop && st.over) {
    const q = +st.over.dataset.q || null, t = taskById(st.id);
    if (t && (t.q || null) !== q) {
      t.q = q; save();
      toast(q ? `Classée dans « ${QUADS[q].verb} »` : 'Remise dans « À classer »');
    }
  }
  refresh();
}
document.addEventListener('touchmove', e => { if (tdrag) e.preventDefault(); }, { passive: false });
function toggleTask(t) {
  if (t.doneAt) { t.doneAt = null; save(); refresh(); return; }
  t.doneAt = todayKey(); save(); refresh();
  toast('Tâche terminée ✓', 'Annuler', () => { t.doneAt = null; save(); refresh(); });
}
function deleteTask(id) {
  const i = S.tasks.findIndex(x => x.id === id); if (i < 0) return;
  const [t] = S.tasks.splice(i, 1);
  save(); refresh();
  toast(`« ${t.title} » supprimée`, 'Annuler', () => { S.tasks.splice(Math.min(i, S.tasks.length), 0, t); save(); refresh(); });
}
function openTask(t) {
  const isNew = !t;
  const f = t ? { title: t.title, due: t.due, note: t.note || '', q: t.q || null } : { title: '', due: addDays(todayKey(), 7), note: '', q: null };
  const body = () => {
    const opts = dueOptions();
    const match = opts.find(o => o.due === f.due);   // une seule option surlignée si plusieurs tombent le même jour
    const custom = !match;
    return `<div class="grab"></div><h2 style="margin-bottom:16px">${isNew ? 'Nouvelle tâche' : 'Modifier la tâche'}</h2>
    <div class="field"><label class="l" for="tTitle">Tâche</label>
      <input class="inp" id="tTitle" maxlength="100" placeholder="Ex : Faire la vaisselle" value="${esc(f.title)}" autocomplete="off"></div>
    <div class="field"><span class="l">À faire avant</span>
      <div class="dues">${opts.map(o => `<button data-t="due" data-v="${o.due}" data-o="${o.id}" class="${(f.pick ? f.pick === o.id : match === o) && o.due === f.due ? 'on' : ''}">${o.label}<small>${fmtDue(o.due)}</small></button>`).join('')}</div>
      <label class="l" for="tDate" style="margin-top:14px">Ou une date précise</label>
      <input class="inp${custom ? ' picked' : ''}" id="tDate" type="date" value="${f.due}"></div>
    <div class="field"><span class="l">Case de la matrice</span>
      <div class="qpick">${[1, 2, 3, 4].map(q => `<button data-t="q" data-v="${q}" style="--qc:${QUADS[q].color}" class="${f.q === q ? 'on' : ''}"><b>${QUADS[q].verb}</b><small>${QUADS[q].sub}</small></button>`).join('')}</div>
      <button class="qnone ${f.q ? '' : 'on'}" data-t="q" data-v="0">À classer plus tard</button></div>
    <div class="field"><label class="l" for="tNote">Note (facultatif)</label>
      <input class="inp" id="tNote" maxlength="140" placeholder="Ex : vaisselle + plan de travail" value="${esc(f.note)}"></div>
    <button class="btn" data-t="save">${isNew ? 'Ajouter la tâche' : 'Enregistrer'}</button>
    ${isNew ? '' : `<button class="btn danger" data-t="delete">Supprimer la tâche</button>`}`;
  };
  openSheet('', el => {
    const read = () => { f.title = $('#tTitle', el).value; f.note = $('#tNote', el).value; };
    const draw = () => {
      const st = el.scrollTop; el.innerHTML = body(); el.scrollTop = st;
      $('#tDate', el).addEventListener('change', e => { read(); if (e.target.value) { f.due = e.target.value; f.pick = null; draw(); } });
    };
    draw();
    if (isNew) setTimeout(() => { try { $('#tTitle', el).focus(); } catch (e) {} }, 320);
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-t]'); if (!b) return;
      read();
      const k = b.dataset.t;
      if (k === 'due') { f.due = b.dataset.v; f.pick = b.dataset.o; draw(); }
      else if (k === 'q') { f.q = +b.dataset.v || null; draw(); }
      else if (k === 'save') {
        const title = f.title.trim();
        if (!title) { const i = $('#tTitle', el); i.classList.add('shake'); i.focus(); setTimeout(() => i.classList.remove('shake'), 600); toast('Donne un nom à ta tâche'); return; }
        if (!/^\d{4}-\d{2}-\d{2}$/.test(f.due)) { toast('Choisis une échéance'); return; }
        if (isNew) S.tasks.push({ id: uid(), title, due: f.due, note: f.note.trim(), q: f.q, created: todayKey(), doneAt: null });
        else Object.assign(t, { title, due: f.due, note: f.note.trim(), q: f.q, created: t.created > f.due ? f.due : t.created });
        save(); closeSheet(); refresh();
        toast(isNew ? 'Tâche ajoutée' : 'Modifications enregistrées');
      }
      else if (k === 'delete') { closeSheet(); deleteTask(t.id); }
    });
  });
}

function bindDrag() {
  const list = $('#mlist'); if (!list) return;
  list.querySelectorAll('.handle').forEach(handle => {
    handle.addEventListener('pointerdown', e => {
      e.preventDefault();
      const row = handle.closest('.mrow');
      row.classList.add('dragging');
      const pid = e.pointerId;
      const move = ev => {
        if (ev.pointerId !== pid) return;
        const y = ev.clientY;
        const rows = [...list.querySelectorAll('.mrow:not(.dragging)')];
        let before = null;
        for (const r of rows) { const b = r.getBoundingClientRect(); if (y < b.top + b.height / 2) { before = r; break; } }
        if (before) { if (row.nextSibling !== before) list.insertBefore(row, before); }
        else if (list.lastElementChild !== row) list.appendChild(row);
        list.querySelectorAll('.mrow .rank').forEach((el, i) => el.textContent = i + 1);
      };
      const up = ev => {
        if (ev.pointerId !== pid) return;
        row.classList.remove('dragging');
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        const ids = [...list.querySelectorAll('.mrow')].map(r => r.dataset.id);
        S.habits.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
        save(); refresh();
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    });
  });
}

      }
      else if (k === 'addPortion') { f.portions.push({ label: '', amountTxt: '' }); draw(); }
      else if (k === 'delPortion') { f.portions.splice(+v, 1); draw(); }
      else if (k === 'save') {
        const name = f.name.trim();
        if (!name) { const i = $('#fName', el); i.classList.add('shake'); i.focus(); setTimeout(() => i.classList.remove('shake'), 600); toast('Donne un nom à ton habitude'); return; }
        if (!f.days.length) { toast('Choisis au moins un jour'); return; }
        const unit = f.type === 'check' ? '' : f.unit.trim();
        let goal, portions;
        if (f.type === 'goal') {
          goal = parseFloat(String(f.goalTxt).replace(',', '.'));
          if (!(goal > 0)) { const i = $('#fGoal', el); i.classList.add('shake'); i.focus(); setTimeout(() => i.classList.remove('shake'), 600); toast('Indique un objectif par jour'); return; }
          portions = [];
          for (const p of f.portions) {
            if (!p.label.trim() && !p.amountTxt.trim()) continue;
            const amount = parseQty(p.amountTxt, unit);
            if (!(amount > 0)) { toast(`Quantité invalide pour « ${p.label || 'raccourci'} »`); return; }
            portions.push({ label: p.label.trim() || fmtQty(amount, unit), amount });
          }
        }
        const data = { name, icon: f.icon || '✅', color: f.color, days: f.days, type: f.type, unit, note: f.note.trim() };
        if (f.type === 'goal') Object.assign(data, { goal: roundQ(goal), portions });
        if (isNew) S.habits.push(Object.assign({ id: uid(), start: todayKey(), history: {}, created: Date.now() }, data));
        else Object.assign(h, data);
        save(); closeSheet(); refresh();
        toast(isNew ? 'Habitude créée' : 'Modifications enregistrées');
      }
      else if (k === 'delete') {
        const ok = await confirmBox('Supprimer cette habitude ?', `« ${h.name} » et tout son historique seront supprimés. Tu pourras annuler juste après.`, 'Supprimer');
        if (!ok) return;
        closeSheet(sheets.length);
        deleteHabit(h.id, true);
      }
    });
  });
}

function deleteHabit(id) {
  const i = S.habits.findIndex(x => x.id === id); if (i < 0) return;
  const [h] = S.habits.splice(i, 1);
  save(); refresh();
  toast(`« ${h.name} » supprimée`, 'Annuler', () => {
    S.habits.splice(Math.min(i, S.habits.length), 0, h); save(); refresh(); toast('Habitude restaurée');
  });
}

function openValue(h, k) {

/* ---------- Ajout de quantités (habitudes « objectif ») ---------- */
function addGoal(h, k, amount) {
  const before = goalTotal(h, k), wasDone = isDone(h, k);
  const total = Math.max(0, roundQ(before + amount));
  setValue(h, k, total > 0 ? total : null);
  if (!wasDone && isDone(h, k)) { toast(`Objectif atteint ${h.icon} Habitude validée`); setTimeout(() => celebrate(k), 2700); }
  else if (amount > 0) toast(`+ ${fmtQty(amount, h.unit)} · ${fmtQty(total, h.unit)} / ${fmtQty(h.goal, h.unit)}`, 'Annuler', () => setValue(h, k, before > 0 ? before : null));
}
function openGoal(h, k) {

        <div class="gleft">${done ? '✓ Objectif atteint, habitude validée' : `Encore ${esc(fmtQty(roundQ(h.goal - cur), h.unit))}`}</div>
        ${(h.portions || []).length ? `<div class="gquick">${h.portions.map((pt, i) => `<button data-g="portion" data-i="${i}"><b>+ ${esc(pt.label)}</b><small>${esc(fmtQty(pt.amount, h.unit))}</small></button>`).join('')}</div>` : ''}
        <label class="l" for="gAmt" style="margin-top:18px">${editTotal ? 'Corriger le total de la journée' : 'Autre quantité'}</label>
        <div class="gcustom"><input class="inp" id="gAmt" inputmode="decimal" autocomplete="off" placeholder="${isLitre(h.unit) ? 'Ex : 330 ml' : 'Ex : 1'}" value="${editTotal ? esc(String(cur).replace('.', ',')) : ''}">
          <button class="gadd" data-g="${editTotal ? 'setTotal' : 'custom'}">${editTotal ? 'OK' : 'Ajouter'}</button></div>

        </div>
