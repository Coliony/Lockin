/* ---------- Détail d'une habitude : stats + calendrier ---------- */
const shiftMonth = (m, n) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
function calHtml(h, month) {
  const [y, m] = month.split('-').map(Number);
  const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7;
  const dim = new Date(y, m, 0).getDate();
  const t = todayKey();
  let s = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(x => `<div class="wd">${x}</div>`).join('');
  for (let i = 0; i < offset; i++) s += '<div class="cell empty"></div>';
  let done = 0, missed = 0;
  for (let d = 1; d <= dim; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`, st = status(h, k);
    if (st === 'done') done++; if (st === 'missed') missed++;
    const partial = h.type === 'goal' && st !== 'done' && goalTotal(h, k) > 0;
    s += `<button class="cell ${st}${partial ? ' partial' : ''}${k === t ? ' today' : ''}" data-d="day" data-k="${k}" ${st === 'future' ? 'disabled' : ''}>${d}</button>`;
  }
  return { html: `<div class="cal">${s}</div>`, done, missed };
}
function spark(vals, color) {
  if (vals.length < 2) return '';
  const W = 320, H = 96, P = 10, ys = vals.map(v => v[1]);
  const mn = Math.min(...ys), mx = Math.max(...ys), rg = mx - mn || 1;
  const pts = vals.map((v, i) => [P + i * (W - 2 * P) / (vals.length - 1), H - P - (v[1] - mn) / rg * (H - 2 * P)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}"/>
    ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${color}"/>`).join('')}</svg>`;
}
function openDetail(id) {
  let month = view.slice(0, 7);
  openSheet('', (el, w) => {
    const draw = () => {
      const h = byId(id); if (!h) return;
      el.style.setProperty('--c', h.color);
      const r30 = rate(h), cal = calHtml(h, month);
      const [cy, cm] = month.split('-').map(Number);
      const mLabel = cap(new Date(cy, cm - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }));
      let html = `<div class="shead"><button class="iconbtn" data-d="close" aria-label="Fermer">${I.close}</button>
          <button class="iconbtn" data-d="edit" aria-label="Modifier">${I.edit}</button></div>
        <div class="dhead"><div class="hicon">${esc(h.icon)}</div><div><h2>${esc(h.name)}</h2><div class="mute small">${daysLabel(h.days)} · depuis le ${parse(h.start).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })}</div></div></div>
        ${h.note ? `<div class="note">${esc(h.note)}</div>` : ''}
        <div class="tiles two" style="margin-top:14px">
          <div class="tile"><b>🔥 ${streak(h)} j</b><span>série en cours</span></div>
          <div class="tile"><b>🏆 ${bestStreak(h)} j</b><span>meilleure série</span></div>
          <div class="tile"><b>${r30 === null ? '–' : r30 + ' %'}</b><span>réussite sur 30 jours</span></div>
          <div class="tile"><b>${Object.keys(h.history).filter(k => isDone(h, k)).length}</b><span>fois au total</span></div></div>
        <div class="monthnav"><button data-d="prev" aria-label="Mois précédent">${I.left}</button><b>${mLabel}</b>
          <button data-d="next" aria-label="Mois suivant" ${month >= todayKey().slice(0, 7) ? 'disabled' : ''}>${I.right}</button></div>
        ${cal.html}
        <div class="legend"><span><i style="background:${h.color}"></i>Fait</span><span><i style="background:color-mix(in srgb,var(--danger) 40%,var(--card))"></i>Oublié</span><span><i style="box-shadow:inset 0 0 0 1px #2E323C"></i>Non prévu</span></div>
        <div class="monthline">Ce mois : <b style="color:var(--text)">${cal.done}</b> fait${cal.done > 1 ? 's' : ''} · <b style="color:var(--danger)">${cal.missed}</b> oublié${cal.missed > 1 ? 's' : ''}. Touche un jour pour corriger.</div>`;
      if (h.type === 'value') {
        const vals = valueEntries(h);
        if (vals.length) {
          const recent = vals.slice(-30), ys = vals.map(v => v[1]);
          const first = recent[0][1], lastV = recent[recent.length - 1][1], diff = lastV - first;
          html += `<div class="section">Valeurs${h.unit ? ' (' + esc(h.unit) + ')' : ''}</div>
            <div class="tiles"><div class="tile"><b>${fmtNum(lastV)}</b><span>dernière</span></div>
            <div class="tile"><b>${diff > 0 ? '+' : ''}${fmtNum(diff)}</b><span>évolution (${recent.length} saisies)</span></div>
            <div class="tile"><b>${fmtNum(Math.min(...ys))}–${fmtNum(Math.max(...ys))}</b><span>min – max</span></div></div>
            ${spark(recent, h.color)}
            <div class="vlist">${vals.slice(-7).reverse().map(([k, v]) => `<div><span class="mute">${fmtShort(k)}</span><b>${fmtNum(v)} ${esc(h.unit)}</b></div>`).join('')}</div>`;
        }
      }
      if (h.type === 'goal') {
        const t = todayKey();
        let sum = 0, n = 0;
        for (let i = 1; i <= 7; i++) { const k = addDays(t, -i); if (k >= h.start && sched(h, k)) { sum += goalTotal(h, k); n++; } }
        const rows = [];
        for (let i = 0; i < 7; i++) { const k = addDays(t, -i); if (k < h.start) break; rows.push(k); }
        html += `<div class="section">Quantités (objectif ${esc(fmtQty(h.goal, h.unit))} par jour)</div>
          <div class="tiles two"><div class="tile"><b>${esc(fmtQty(goalTotal(h, t), h.unit))}</b><span>aujourd’hui</span></div>
          <div class="tile"><b>${n ? esc(fmtQty(roundQ(sum / n), h.unit)) : '–'}</b><span>moyenne sur 7 jours</span></div></div>
          <div class="vlist">${rows.map(k => { const v = goalTotal(h, k), ok = isDone(h, k);
            return `<div><span class="mute">${fmtShort(k)}</span><span class="vbar"><i style="width:${Math.min(100, Math.round(v / h.goal * 100))}%"></i></span><b style="${ok ? 'color:var(--c)' : ''}">${esc(fmtQty(v, h.unit))}${ok ? ' ✓' : ''}</b></div>`; }).join('')}</div>`;
      }
      el.innerHTML = html;
    };
    w._refresh = draw;
    draw();
    el.addEventListener('click', e => {
      const a = e.target.closest('[data-d]'); if (!a) return;
      const h = byId(id); if (!h) return;
      const act = a.dataset.d;
      if (act === 'close') closeSheet();
      else if (act === 'edit') openForm(h);
      else if (act === 'prev') { month = shiftMonth(month, -1); draw(); }
      else if (act === 'next') { month = shiftMonth(month, 1); draw(); }
      else if (act === 'day') tapHabit(h, a.dataset.k);
    });
  }, true);
}

function exportData() {

$('#importFile').addEventListener('change', async e => {

  if (data && data.kind === 'lockin-diet') {
    const nd = data.log && typeof data.log === 'object' ? Object.keys(data.log).length : 0;
    const nf = Array.isArray(data.foods) ? data.foods.length : 0;
    const nw = data.weights && typeof data.weights === 'object' ? Object.keys(data.weights).length : 0;
    const ok = await confirmBox('Importer ton suivi de diète ?', `Tes objectifs seront remplacés. ${nf} aliment(s), ${nd} jour(s) de journal et ${nw} pesée(s) seront ajoutés à ce que tu as déjà. Tes habitudes et tâches ne changent pas.`, 'Importer');
    if (!ok) return;
    closeSheet(sheets.length);
    const r = importDiet(data);
    toast(`Diète importée : ${r.nf} aliments, ${r.ne} entrées, ${r.nw} pesée(s)`);
    return;
  }
  const validHabit = h => h && typeof h === 'object'
    && typeof h.id === 'string' && /^[a-z0-9]{1,40}$/i.test(h.id)
    && typeof h.name === 'string' && h.name.trim()
    && typeof h.color === 'string' && /^#[0-9a-f]{6}$/i.test(h.color)
    && typeof h.start === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(h.start)
    && Array.isArray(h.days) && h.days.every(d => Number.isInteger(d) && d >= 0 && d <= 6)
    && (h.type === 'check' || h.type === 'value' || h.type === 'goal')
    && (h.type !== 'goal' || (typeof h.goal === 'number' && h.goal > 0 && Array.isArray(h.portions)
        && h.portions.every(p => p && typeof p.label === 'string' && typeof p.amount === 'number' && p.amount > 0)))
    && h.history && typeof h.history === 'object'
    && Object.entries(h.history).every(([k, v]) => /^\d{4}-\d{2}-\d{2}$/.test(k) && typeof v === 'number' && isFinite(v));
  const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
  const validTask = t => t && typeof t === 'object'
    && typeof t.id === 'string' && /^[a-z0-9]{1,40}$/i.test(t.id)
    && typeof t.title === 'string' && t.title.trim()
    && isDate(t.due) && isDate(t.created) && (t.doneAt === null || isDate(t.doneAt))
    && (t.note === undefined || typeof t.note === 'string')
    && (t.q === undefined || t.q === null || [1, 2, 3, 4].includes(t.q));
  if (data && data.tasks === undefined) data.tasks = [];
  if (!data || !Array.isArray(data.habits) || !data.habits.every(validHabit) || !Array.isArray(data.tasks) || !data.tasks.every(validTask)) { toast('Ce fichier n’est pas une sauvegarde Lock In valide'); return; }
  const ok = await confirmBox('Importer cette sauvegarde ?', `Tes habitudes (${S.habits.length}), tâches (${S.tasks.length}) et ton suivi alimentaire actuels seront remplacés par ceux de la sauvegarde.`, 'Importer');

// Matrice : appui maintenu (220 ms) sur une tâche pour la saisir, puis glisser
app.addEventListener('pointerdown', e => {
  const chip = e.target.closest('.tchip');
  if (!chip || e.target.closest('[data-act="tcheck"]') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const st = { chip, id: chip.dataset.id, pid: e.pointerId, sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, active: false, over: null };
  st.timer = setTimeout(() => startTaskDrag(st), 220);
  const move = ev => {
    if (ev.pointerId !== st.pid) return;
    st.x = ev.clientX; st.y = ev.clientY;
    if (!st.active) { if (Math.hypot(st.x - st.sx, st.y - st.sy) > 8) end(false); return; }
    moveTaskDrag(st);
  };
  const up = ev => { if (ev.pointerId === st.pid) end(ev.type === 'pointerup'); };
  function end(drop) {
    clearTimeout(st.timer);
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    if (st.active) endTaskDrag(st, drop);
  }
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
});
app.addEventListener('contextmenu', e => { if (e.target.closest('.tchip')) e.preventDefault(); });

app.addEventListener('click', e => {
  if (lpFired) { lpFired = false; return; }
  if (tdragEnded) return;
  const chip = e.target.closest('.tchip');
  if (chip && !e.target.closest('[data-act]')) { const t = taskById(chip.dataset.id); if (t) openTask(t); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, h = el.dataset.id ? byId(el.dataset.id) : null;
  switch (act) {
    case 'tap': if (h) tapHabit(h, view); break;
    case 'prevDay': view = addDays(view, -1); renderMain(); break;
    case 'nextDay': if (view < todayKey()) { view = addDays(view, 1); renderMain(); } break;
    case 'goToday': view = todayKey(); renderMain(); break;
    case 'settings': openSettings(); break;
    case 'detail': if (h) openDetail(h.id); break;
    case 'edit': if (h) openForm(h); break;
    case 'del': if (h) deleteHabit(h.id); break;
    case 'new': openForm(null); break;
    case 'suggest': openForm(null, SUGGESTIONS[+el.dataset.i]); break;
    case 'install': install(); break;
    case 'hideInstall': S.hideInstall = true; save(); renderMain(); break;
    case 'newTask': openTask(null); break;
    case 'tcheck': { const t = taskById(el.dataset.id); if (t) toggleTask(t); break; }
    case 'tedit': { const t = taskById(el.dataset.id); if (t) openTask(t); break; }
    case 'toggleDone': showDone = !showDone; renderMain(); break;
    case 'taskView': S.taskView = el.dataset.v; save(); renderMain(); break;
    case 'dietGoals': openGoals(); break;
    case 'addFood': openFoodSearch(dietView); break;
    case 'editEntry': openEntry(dietView, el.dataset.id); break;
    case 'dietPrev': dietView = addDays(dietView, -1); dietMonth = dietView.slice(0, 7); renderMain(); break;
    case 'dietNext': if (dietView < todayKey()) { dietView = addDays(dietView, 1); dietMonth = dietView.slice(0, 7); renderMain(); } break;
    case 'dietToday': dietView = todayKey(); dietMonth = dietView.slice(0, 7); renderMain(); break;
    case 'dietDay': if (el.dataset.k <= todayKey()) { dietView = el.dataset.k; dietMonth = dietView.slice(0, 7); renderMain(); window.scrollTo({ top: 0, behavior: 'smooth' }); } break;
    case 'kRange': S.diet.kRange = +el.dataset.v; save(); renderMain(); break;
    case 'dmPrev': dietMonth = shiftMonth(dietMonth, -1); renderMain(); break;
    case 'dmNext': if (dietMonth < todayKey().slice(0, 7)) { dietMonth = shiftMonth(dietMonth, 1); renderMain(); } break;
    case 'export': exportData(); break;
    case 'createWeight': createWeightHabit(); break;
    case 'weighIn': { const wh = weightHabit(); if (wh) tapHabit(wh, todayKey()); break; }
    case 'wRange': S.diet.wRange = el.dataset.v; save(); renderMain(); break;
    case 'goTasks': tab = 'tasks'; renderMain(); window.scrollTo(0, 0); break;
  }
});
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  tab = b.dataset.tab; if (tab === 'today') view = todayKey();
  if (tab === 'diet') { dietView = todayKey(); dietMonth = dietView.slice(0, 7); }
  renderMain(); window.scrollTo(0, 0);
});
$('#fab').addEventListener('click', () => tab === 'tasks' ? openTask(null) : tab === 'diet' ? openFoodSearch(dietView) : openForm(null));

// Changement de jour quand l'appli revient au premier plan
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = todayKey();
  if (t !== lastToday) { if (view === lastToday) view = t; if (dietView === lastToday) { dietView = t; dietMonth = t.slice(0, 7); } lastToday = t; }
  refresh();
});

renderMain();
})();
</script>
